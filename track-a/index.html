<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>트랙 A - 달님과 함께하는 한가위</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(180deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: white;
        }

        .container {
            max-width: 900px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 50px;
        }

        .back-btn {
            display: inline-block;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            margin-bottom: 20px;
            font-size: 1em;
            transition: all 0.3s;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 1.2em;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 30px;
        }

        .moon-progress {
            text-align: center;
            margin-bottom: 50px;
            font-size: 2em;
            letter-spacing: 10px;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 25px;
        }

        .game-card {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            color: white;
            position: relative;
            overflow: hidden;
        }

        .game-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.1);
            transform: translateX(-100%);
            transition: transform 0.3s;
            z-index: 0;
        }

        .game-card:hover::before {
            transform: translateX(0);
        }

        .game-card:hover {
            transform: translateY(-10px);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .game-content {
            position: relative;
            z-index: 1;
        }

        .game-icon {
            font-size: 3.5em;
            margin-bottom: 15px;
            display: block;
        }

        .game-card h3 {
            font-size: 1.4em;
            margin-bottom: 10px;
        }

        .game-card p {
            font-size: 0.9em;
            opacity: 0.9;
        }

        .completed {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #4caf50;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2em;
            z-index: 2;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8em;
            }

            .games-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="../" class="back-btn">← 돌아가기</a>
            <h1>🧸 트랙 A</h1>
            <p class="subtitle">달님과 함께하는 한가위</p>
        </div>

        <div class="moon-progress">
            <span id="moonPhase">🌑</span>
        </div>

        <div class="games-grid">
            <a href="games/01-find-moon.html" class="game-card">
                <div class="game-content">
                    <span class="game-icon">🌕</span>
                    <h3>달님을 찾아라</h3>
                    <p>추석에 보는 달을 찾아보세요</p>
                </div>
                <div class="completed" id="completed-1" style="display:none;">✓</div>
            </a>

            <a href="games/02-songpyeon.html" class="game-card">
                <div class="game-content">
                    <span class="game-icon">🍡</span>
                    <h3>송편 공방</h3>
                    <p>송편을 직접 만들어 보세요</p>
                </div>
                <div class="completed" id="completed-2" style="display:none;">✓</div>
            </a>

            <a href="games/03-games.html" class="game-card">
                <div class="game-content">
                    <span class="game-icon">🎲</span>
                    <h3>한가위 놀이마당</h3>
                    <p>추석 놀이를 찾아보세요</p>
                </div>
                <div class="completed" id="completed-3" style="display:none;">✓</div>
            </a>

            <a href="games/04-harvest.html" class="game-card">
                <div class="game-content">
                    <span class="game-icon">🌾</span>
                    <h3>풍년 바구니</h3>
                    <p>새로 난 음식을 담아보세요</p>
                </div>
                <div class="completed" id="completed-4" style="display:none;">✓</div>
            </a>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'track-a-progress';

        function loadProgress() {
            const progress = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {
                games: [false, false, false, false]
            };
            return progress;
        }

        function updateMoon() {
            const progress = loadProgress();
            const completedCount = progress.games.filter(Boolean).length;
            const moonPhases = ['🌑', '🌒', '🌓', '🌔', '🌕'];
            document.getElementById('moonPhase').textContent = moonPhases[completedCount];

            // Show completed badges
            progress.games.forEach((completed, index) => {
                if (completed) {
                    document.getElementById(`completed-${index + 1}`).style.display = 'flex';
                }
            });
        }

        updateMoon();
    </script>
</body>
</html>
