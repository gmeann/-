<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>한가위 놀이마당 - 한가위 어드벤처</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(180deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: white;
        }

        .container {
            max-width: 900px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .back-btn {
            display: inline-block;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            margin-bottom: 20px;
            font-size: 0.95em;
            transition: all 0.3s;
            border: none;
            cursor: pointer;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 15px;
        }

        .question {
            font-size: 1.3em;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 40px;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .game-card {
            background: rgba(255, 255, 255, 0.1);
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 25px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            user-select: none;
        }

        .game-card:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 215, 0, 0.6);
            transform: scale(1.05);
        }

        .game-card.selected {
            border-color: #4caf50;
            background: rgba(76, 175, 80, 0.3);
            animation: pulse 0.5s ease-out;
        }

        .game-icon {
            font-size: 3.5em;
            margin-bottom: 10px;
        }

        .game-name {
            font-size: 1.1em;
            font-weight: bold;
        }

        .result {
            background: rgba(76, 175, 80, 0.2);
            border: 2px solid rgba(76, 175, 80, 0.5);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            display: none;
            animation: slideUp 0.5s ease-out;
        }

        .result.show {
            display: block;
        }

        .result h2 {
            font-size: 2em;
            margin-bottom: 15px;
            color: #4caf50;
        }

        .result p {
            font-size: 1.1em;
            line-height: 1.8;
            margin-bottom: 15px;
        }

        .fact-box {
            background: rgba(255, 215, 0, 0.1);
            border: 2px solid rgba(255, 215, 0, 0.5);
            border-radius: 15px;
            padding: 20px;
            margin-top: 20px;
            font-size: 0.95em;
            text-align: left;
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 30px;
        }

        button {
            padding: 15px 35px;
            font-size: 1.1em;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }

        .next-btn {
            background: #4caf50;
            color: white;
        }

        .next-btn:hover {
            background: #45a049;
            transform: scale(1.05);
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.1);
            }
            100% {
                transform: scale(1);
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8em;
            }

            .games-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <button class="back-btn" onclick="goBack()">← 돌아가기</button>
            <h1>🎲 한가위 놀이마당</h1>
            <p class="question">추석에 하는 놀이를 모두 찾아보세요!</p>
        </div>

        <div class="games-grid" id="gamesList"></div>

        <div class="result" id="result">
            <h2 id="resultTitle">맞았어요!</h2>
            <p id="resultText"></p>
            <div class="fact-box" id="factBox"></div>
            <div class="action-buttons">
                <button class="next-btn" onclick="continueGame()">계속하기</button>
            </div>
        </div>

        <div id="completionMessage" style="text-align: center; margin-top: 40px; display: none;">
            <div class="result show">
                <h2>🎉 모든 놀이를 찾았어요!</h2>
                <p>추석에는 이렇게 다양한 놀이를 해요!</p>
                <div class="fact-box">
                    <strong>📚 추석 팩트:</strong>
                    <p>추석 전날인 추석 전날, 추석 당일, 추석 다음날까지 사흘 동안 놀이를 한답니다. 가족과 함께하는 전통놀이는 우리의 문화를 지켜주는 소중한 활동이에요!</p>
                </div>
                <div class="action-buttons">
                    <button class="next-btn" onclick="completeGame()">다음 게임으로</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'track-a-progress';

        const games = [
            {
                emoji: '🎳',
                name: '윷놀이',
                fact: '윷놀이는 네 개의 막대를 던져서 나온 모양으로 말을 움직이는 게임이에요.'
            },
            {
                emoji: '💃',
                name: '강강술래',
                fact: '강강술래는 손을 잡고 원을 그리며 도는 남녀 집단 놀이에요. 주로 여자들이 밤새도록 한답니다.'
            },
            {
                emoji: '🎯',
                name: '제기차기',
                fact: '제기차기는 깃털이 달린 제기를 발로 차서 떨어뜨리지 않는 놀이예요. 발끝의 감각이 중요해요!'
            },
            {
                emoji: '🧗',
                name: '줄다리기',
                fact: '줄다리기는 지역사람들이 함께 참여하여 풍년을 기원하는 놀이예요.'
            }
        ];

        let selectedCount = 0;
        let selectedGames = new Set();

        function initGame() {
            const gamesList = document.getElementById('gamesList');
            gamesList.innerHTML = '';

            games.forEach((game, index) => {
                const card = document.createElement('div');
                card.className = 'game-card';
                card.innerHTML = `<div class="game-icon">${game.emoji}</div><div class="game-name">${game.name}</div>`;
                card.onclick = () => selectGame(card, index, game);
                gamesList.appendChild(card);
            });
        }

        function selectGame(element, index, game) {
            if (selectedGames.has(index)) return;

            element.classList.add('selected');
            selectedGames.add(index);
            selectedCount++;

            setTimeout(() => {
                showResult(game);
            }, 500);
        }

        function showResult(game) {
            const resultEl = document.getElementById('result');
            const titleEl = document.getElementById('resultTitle');
            const textEl = document.getElementById('resultText');
            const factEl = document.getElementById('factBox');

            titleEl.textContent = `✨ ${game.name}을 찾았어요!`;
            textEl.textContent = game.name + '은 추석에 하는 전통 놀이예요!';
            factEl.innerHTML = `<strong>📚 알아보기:</strong><p>${game.fact}</p>`;

            resultEl.classList.add('show');

            setTimeout(() => {
                resultEl.classList.remove('show');
                if (selectedCount === games.length) {
                    setTimeout(() => {
                        document.getElementById('completionMessage').style.display = 'block';
                    }, 500);
                }
            }, 2000);
        }

        function continueGame() {
            document.getElementById('result').classList.remove('show');
        }

        function completeGame() {
            // Save progress
            const progress = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {
                games: [false, false, false, false]
            };
            progress.games[2] = true;
            localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));

            // Go back to main page
            window.location.href = '../';
        }

        function goBack() {
            window.location.href = '../';
        }

        initGame();
    </script>
</body>
</html>
