<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>놀이마당 - 한가위 어드벤처</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(180deg, #f5e6d3 0%, #e8d4b8 50%, #dfc39e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #3d2817;
        }

        .container {
            max-width: 900px;
            width: 100%;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            padding: 10px 20px;
            background: rgba(139, 69, 19, 0.2);
            color: #3d2817;
            border: none;
            border-radius: 50px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            margin-bottom: 20px;
        }

        .back-btn:hover {
            background: rgba(139, 69, 19, 0.3);
            transform: translateX(-5px);
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 15px;
            color: #8b4513;
        }

        .subtitle {
            font-size: 1.3em;
            color: #5d3a1a;
            margin-bottom: 20px;
        }

        .game-area {
            background: rgba(255, 255, 255, 0.85);
            border-radius: 30px;
            padding: 40px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            min-height: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .step {
            display: none;
            width: 100%;
            text-align: center;
        }

        .step.active {
            display: block;
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .character {
            font-size: 5em;
            margin-bottom: 20px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .dialogue {
            font-size: 1.3em;
            color: #3d2817;
            margin-bottom: 30px;
            font-weight: 500;
            line-height: 1.6;
        }

        /* Step 0: Intro */
        button {
            padding: 12px 30px;
            font-size: 1.05em;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
        }

        .success-btn {
            background: #4caf50;
            color: white;
        }

        .success-btn:hover {
            background: #45a049;
            transform: scale(1.05);
        }

        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 30px;
        }

        /* Step 1: Play Selection */
        .play-options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .play-card {
            background: white;
            border: 3px solid #8b4513;
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            user-select: none;
        }

        .play-card.active {
            border-color: #ffd700;
            background: rgba(255, 215, 0, 0.1);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
        }

        .play-card.locked {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .play-card:not(.locked):hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        .play-icon {
            font-size: 4em;
            margin-bottom: 15px;
        }

        .play-name {
            font-size: 1.4em;
            color: #3d2817;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .play-description {
            font-size: 1em;
            color: #666;
            margin-bottom: 15px;
        }

        .lock-label {
            display: inline-block;
            padding: 5px 15px;
            background: #999;
            color: white;
            border-radius: 20px;
            font-size: 0.9em;
            margin-top: 10px;
        }

        /* Step 2: Ganggangsullae Game */
        .game-instructions {
            font-size: 1.2em;
            color: #8b4513;
            margin-bottom: 30px;
            font-weight: bold;
        }

        .direction-display {
            font-size: 5em;
            margin: 20px 0;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .play-area {
            width: 100%;
            height: 250px;
            background: rgba(255, 215, 0, 0.1);
            border: 3px dashed #8b4513;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 30px 0;
            cursor: pointer;
            transition: all 0.3s;
            user-select: none;
        }

        .play-area:hover {
            background: rgba(255, 215, 0, 0.2);
        }

        .play-area.active {
            background: rgba(76, 175, 80, 0.2);
            border-color: #4caf50;
        }

        .characters-circle {
            font-size: 4em;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .character-item {
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2em;
            animation: rotate 2s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg) translateX(60px) rotate(0deg); }
            to { transform: rotate(360deg) translateX(60px) rotate(-360deg); }
        }

        .round-display {
            font-size: 1.2em;
            color: #8b4513;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .success-effect {
            font-size: 3em;
            animation: float 1s ease-out;
            pointer-events: none;
        }

        @keyframes float {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(-60px) scale(0);
            }
        }

        /* Step 3: Fact Card */
        .fact-box {
            background: rgba(255, 215, 0, 0.15);
            border: 2px solid rgba(255, 215, 0, 0.6);
            border-radius: 15px;
            padding: 20px;
            margin-top: 20px;
            text-align: left;
            font-size: 1em;
            color: #3d2817;
        }

        .fact-box strong {
            display: block;
            margin-bottom: 10px;
            font-size: 1.1em;
        }

        /* Step 4: Result/Completion */
        .result-title {
            font-size: 2.2em;
            color: #4caf50;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .result-message {
            font-size: 1.1em;
            color: #3d2817;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .result-emoji {
            font-size: 4em;
            margin: 20px 0;
            animation: bounce-once 0.5s ease-out;
        }

        @keyframes bounce-once {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8em;
            }

            .game-area {
                padding: 25px;
                min-height: 300px;
            }

            .character {
                font-size: 3.5em;
            }

            .play-options {
                grid-template-columns: 1fr;
            }

            .play-area {
                height: 200px;
            }

            .characters-circle {
                font-size: 3em;
                gap: 5px;
            }

            .character-item {
                width: 50px;
                height: 50px;
                font-size: 1.5em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <button class="back-btn" onclick="goBack()">← 돌아가기</button>

        <div class="header">
            <h1>🎲 놀이마당</h1>
        </div>

        <div class="game-area">
            <!-- Step 0: Intro -->
            <div class="step active" id="step-0">
                <div class="character">🧚</div>
                <div class="dialogue">신나는 전통놀이를 해 볼까요?</div>
                <div class="dialogue" style="font-size: 1.1em; color: #666;">친구들과 함께 놀아 볼까요?</div>
                <div class="action-buttons">
                    <button class="success-btn" onclick="showPlaySelection()">🎲 놀이하러 가기</button>
                </div>
            </div>

            <!-- Step 1: Play Selection -->
            <div class="step" id="step-1">
                <div class="dialogue">어떤 놀이를 해 볼까요?</div>
                <div class="play-options">
                    <div class="play-card active" onclick="startGanggangsullae()">
                        <div class="play-icon">🌕</div>
                        <div class="play-name">강강술래</div>
                        <div class="play-description">손을 잡고 빙글빙글 돌아요!</div>
                    </div>
                    <div class="play-card locked">
                        <div class="play-icon">🪵</div>
                        <div class="play-name">윷놀이</div>
                        <div class="play-description">윷가락을 던져요!</div>
                        <div class="lock-label">준비 중</div>
                    </div>
                </div>
            </div>

            <!-- Step 2: Ganggangsullae Game -->
            <div class="step" id="step-2">
                <div class="round-display" id="roundDisplay">ROUND 1</div>
                <div class="game-instructions" id="instructions">왼쪽으로 빙글빙글 돌아요!</div>
                <div class="direction-display" id="directionDisplay">⬅️</div>
                <div class="play-area" id="playArea" onclick="playRound()">
                    <div class="characters-circle">
                        <div class="character-item">👧</div>
                        <div class="character-item">👦</div>
                        <div class="character-item">👧</div>
                        <div class="character-item">👦</div>
                        <div class="character-item">👧</div>
                    </div>
                </div>
                <div style="text-align: center; color: #999; font-size: 1em;">⬆️ 여기를 터치해 주세요!</div>
            </div>

            <!-- Step 3: Fact Card -->
            <div class="step" id="step-3">
                <div class="result-emoji">🌕</div>
                <div class="dialogue">와! 함께 돌아 보았어요!</div>
                <div class="fact-box">
                    <strong>🌕 강강술래</strong>
                    강강술래는 사람들이 손을 잡고 둥글게 돌며 노는 전통 놀이예요. 강강술래는 유네스코 인류무형문화유산으로 등재되어 있어요.
                </div>
                <div class="action-buttons">
                    <button class="success-btn" onclick="nextStep()">다음 ▶</button>
                </div>
            </div>

            <!-- Step 4: Completion -->
            <div class="step" id="step-4">
                <div class="character">🧚</div>
                <div class="result-title">🎉 놀이마당 성공!</div>
                <div class="result-emoji">🌕</div>
                <div class="result-message">신나는 전통놀이를 해 보았어요!</div>
                <div class="result-message" style="color: #ffd700; font-weight: bold;">달 조각 획득!</div>
                <div class="action-buttons">
                    <button class="success-btn" onclick="completeGame()">🏘️ 마을로 돌아가기</button>
                    <button class="success-btn" onclick="resetGame()">🔄 다시 놀기</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'track-a-progress';
        const GAME_COMPLETE_KEY = 'track-a-game-3-complete';
        const MOON_PIECES_KEY = 'track-a-moon-pieces';

        let currentStep = 0;
        let currentRound = 1;
        let gameAlreadyCompleted = false;

        function showStep(stepIndex) {
            document.querySelectorAll('.step').forEach((step, idx) => {
                step.classList.toggle('active', idx === stepIndex);
            });
            currentStep = stepIndex;
        }

        function showPlaySelection() {
            showStep(1);
        }

        function startGanggangsullae() {
            currentRound = 1;
            showStep(2);
        }

        function playRound() {
            const playArea = document.getElementById('playArea');
            playArea.classList.add('active');

            // Show success effect
            const effect = document.createElement('div');
            effect.className = 'success-effect';
            effect.textContent = '빙글빙글!';
            playArea.appendChild(effect);

            setTimeout(() => {
                effect.remove();
                playArea.classList.remove('active');

                if (currentRound < 3) {
                    currentRound++;
                    updateRoundDisplay();
                } else {
                    // All rounds complete, show fact card
                    setTimeout(() => {
                        showStep(3);
                    }, 500);
                }
            }, 800);
        }

        function updateRoundDisplay() {
            const roundDisplay = document.getElementById('roundDisplay');
            const instructions = document.getElementById('instructions');
            const directionDisplay = document.getElementById('directionDisplay');

            roundDisplay.textContent = `ROUND ${currentRound}`;

            if (currentRound === 2) {
                instructions.textContent = '이번에는 반대로 돌아요!';
                directionDisplay.textContent = '➡️';
            } else if (currentRound === 3) {
                instructions.textContent = '한 번 더 빙글빙글!';
                directionDisplay.textContent = '⬅️';
            }
        }

        function nextStep() {
            showStep(4);
            // Award moon piece
            awardMoonPiece();
        }

        function awardMoonPiece() {
            if (gameAlreadyCompleted) return;

            const moonPieces = JSON.parse(localStorage.getItem(MOON_PIECES_KEY)) || {
                songpyeon: false,
                play: false,
                harvest: false
            };

            if (!moonPieces.play) {
                moonPieces.play = true;
                localStorage.setItem(MOON_PIECES_KEY, JSON.stringify(moonPieces));
            }

            gameAlreadyCompleted = true;
        }

        function completeGame() {
            // Save progress
            const progress = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {
                games: [false, false, false, false]
            };
            progress.games[2] = true;
            localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
            localStorage.setItem(GAME_COMPLETE_KEY, 'true');

            window.location.href = '../';
        }

        function resetGame() {
            currentRound = 1;
            showStep(2);
        }

        function goBack() {
            window.location.href = '../';
        }

        // Check if already completed
        if (localStorage.getItem(GAME_COMPLETE_KEY)) {
            gameAlreadyCompleted = true;
        }
    </script>
</body>
</html>
