<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>풍년 바구니 - 한가위 어드벤처</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(180deg, #f5e6d3 0%, #e8d4b8 50%, #dfc39e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #3d2817;
        }

        .container {
            max-width: 900px;
            width: 100%;
        }

        .back-btn {
            display: inline-block;
            padding: 10px 20px;
            background: rgba(61, 40, 23, 0.2);
            color: #3d2817;
            border: none;
            border-radius: 50px;
            margin-bottom: 20px;
            font-size: 0.95em;
            cursor: pointer;
            transition: all 0.3s;
        }

        .back-btn:hover {
            background: rgba(61, 40, 23, 0.3);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
            color: #8b4513;
        }

        /* Concept Box */
        .concept-box {
            background: rgba(255, 215, 0, 0.2);
            border: 2px solid rgba(255, 215, 0, 0.6);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 30px;
            text-align: center;
        }

        .concept-title {
            font-size: 1.3em;
            color: #8b4513;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .concept-description {
            font-size: 1.05em;
            color: #3d2817;
            line-height: 1.6;
        }

        .concept-highlight {
            font-weight: 600;
            color: #d2691e;
            background: rgba(255, 215, 0, 0.3);
            padding: 5px 10px;
            border-radius: 5px;
            display: inline-block;
            margin: 5px;
        }

        /* Game Area */
        .game-area {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 30px;
            padding: 40px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            min-height: 500px;
        }

        .instruction {
            font-size: 1.3em;
            color: #3d2817;
            text-align: center;
            margin-bottom: 30px;
            font-weight: 500;
        }

        /* Items Grid */
        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
            margin-bottom: 40px;
        }

        .item-card {
            background: white;
            border: 3px solid #d4a574;
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            user-select: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .item-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .item-card.selected {
            background: rgba(76, 175, 80, 0.15);
            border-color: #4caf50;
            box-shadow: 0 0 15px rgba(76, 175, 80, 0.3);
        }

        .item-card.wrong {
            background: rgba(244, 67, 54, 0.15);
            border-color: #f44336;
            box-shadow: 0 0 15px rgba(244, 67, 54, 0.3);
        }

        .item-emoji {
            font-size: 2.5em;
        }

        .item-name {
            font-size: 1em;
            font-weight: 600;
            color: #3d2817;
        }

        .item-hint {
            font-size: 0.8em;
            color: #999;
            font-weight: 500;
        }

        /* Basket */
        .basket-area {
            text-align: center;
            margin-top: 40px;
            padding-top: 30px;
            border-top: 3px dashed #d4a574;
        }

        .basket-title {
            font-size: 1.3em;
            color: #8b4513;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .basket {
            background: linear-gradient(135deg, #fff9c4 0%, #ffeb3b 100%);
            border: 3px solid #8b4513;
            border-radius: 20px;
            padding: 30px;
            min-height: 150px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 20px rgba(139, 69, 19, 0.2);
        }

        .basket-icon {
            font-size: 3em;
            margin-bottom: 10px;
        }

        .basket-items {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 15px;
            min-height: 60px;
        }

        .basket-item {
            font-size: 2em;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .basket-item-label {
            font-size: 0.5em;
            color: #3d2817;
            font-weight: 600;
        }

        .count-display {
            font-size: 1.2em;
            color: #8b4513;
            font-weight: 600;
            margin-top: 10px;
        }

        /* Result */
        .result-area {
            display: none;
            text-align: center;
            margin-top: 40px;
            padding: 30px;
            background: rgba(76, 175, 80, 0.1);
            border-radius: 20px;
            border: 2px solid rgba(76, 175, 80, 0.5);
        }

        .result-area.show {
            display: block;
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-title {
            font-size: 2em;
            color: #4caf50;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .result-emoji {
            font-size: 4em;
            margin: 15px 0;
        }

        .result-message {
            font-size: 1.1em;
            color: #3d2817;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .fact-box {
            background: rgba(255, 215, 0, 0.2);
            border: 2px solid rgba(255, 215, 0, 0.6);
            border-radius: 15px;
            padding: 20px;
            margin-top: 20px;
            text-align: left;
            font-size: 1em;
            color: #3d2817;
        }

        .fact-box strong {
            display: block;
            margin-bottom: 10px;
            font-size: 1.1em;
        }

        .moon-fragment {
            font-size: 3em;
            animation: float 3s ease-in-out infinite;
            margin-top: 15px;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        /* Action Buttons */
        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 30px;
        }

        button {
            padding: 12px 30px;
            font-size: 1.05em;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
        }

        .game-btn {
            background: #4caf50;
            color: white;
        }

        .game-btn:hover {
            background: #45a049;
            transform: scale(1.05);
        }

        .game-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8em;
            }

            .game-area {
                padding: 25px;
            }

            .items-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .instruction {
                font-size: 1.1em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <button class="back-btn" onclick="goBack()">← 돌아가기</button>
            <h1>🌾 풍년 바구니</h1>
        </div>

        <!-- Concept Box -->
        <div class="concept-box">
            <div class="concept-title">🌾 햇곡식이란?</div>
            <div class="concept-description">
                <div style="margin: 10px 0;">그 해에 <span class="concept-highlight">새로 난 곡식</span>을 말해요!</div>
                <div style="margin: 10px 0;">예: 올해 처음 나온 쌀, 보리, 옥수수 등</div>
            </div>
        </div>

        <!-- Game Area -->
        <div class="game-area">
            <div class="instruction">📌 그 해에 새로 난 음식을 고르세요!</div>

            <!-- Items Grid -->
            <div class="items-grid" id="itemsGrid"></div>

            <!-- Basket -->
            <div class="basket-area">
                <div class="basket-title">✨ 고른 음식들</div>
                <div class="basket">
                    <div class="basket-icon">🧺</div>
                    <div class="basket-items" id="basketItems">
                        <div style="color: #3d2817; font-size: 1em;">아직 아무것도 없어요</div>
                    </div>
                    <div class="count-display">선택: <span id="selectedCount">0</span>/5개</div>
                </div>
            </div>

            <!-- Result Area -->
            <div class="result-area" id="resultArea">
                <div class="result-title">🎉 완료!</div>
                <div class="result-emoji">🌾</div>
                <div class="result-message">
                    추석에는 그해에 새로 난 곡식과 과일을 차례상에 올렸어요!<br>
                    우리가 고른 음식들이 모두 가을에 수확하는 햇곡식이었어요!
                </div>
                <div class="fact-box">
                    <strong>📚 추석과 햇곡식</strong>
                    <p>추석은 새로 나온 곡식을 하늘과 조상께 감사하는 명절이에요. 쌀, 보리, 옥수수, 밤, 대추 등이 가을에 수확되는 햇곡식이랍니다!</p>
                </div>
                <div class="moon-fragment">🌙</div>
                <p style="font-size: 1.1em; color: #8b4513; margin-top: 20px; font-weight: 600;">달 조각을 획득했어요!</p>
                <div class="action-buttons">
                    <button class="game-btn" onclick="goToMenu()">기록실로 돌아가기</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const items = [
            { emoji: '🌾', name: '쌀', hint: '새 음식 ✓', isNew: true },
            { emoji: '🍚', name: '보리', hint: '새 음식 ✓', isNew: true },
            { emoji: '🌽', name: '옥수수', hint: '새 음식 ✓', isNew: true },
            { emoji: '밤', name: '밤', hint: '새 음식 ✓', isNew: true },
            { emoji: '🔴', name: '대추', hint: '새 음식 ✓', isNew: true },
            { emoji: '🍎', name: '사과', hint: '아닌 음식 ✗', isNew: false },
            { emoji: '🍌', name: '바나나', hint: '아닌 음식 ✗', isNew: false },
            { emoji: '🥕', name: '당근', hint: '아닌 음식 ✗', isNew: false }
        ];

        let selectedItems = [];

        function goBack() {
            window.history.back();
        }

        function goToMenu() {
            localStorage.setItem('gameCompletionState', JSON.stringify({
                'harvest': true,
                ...(JSON.parse(localStorage.getItem('gameCompletionState') || '{}'))
            }));
            window.location.href = '../index.html';
        }

        function renderItems() {
            const grid = document.getElementById('itemsGrid');
            grid.innerHTML = '';

            items.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'item-card';
                card.innerHTML = `
                    <div class="item-emoji">${item.emoji}</div>
                    <div class="item-name">${item.name}</div>
                    <div class="item-hint">${item.hint}</div>
                `;

                card.addEventListener('click', () => selectItem(index, card));
                grid.appendChild(card);
            });
        }

        function selectItem(index, cardElement) {
            const item = items[index];

            if (selectedItems.includes(index)) {
                // 이미 선택된 경우 제거
                selectedItems = selectedItems.filter(i => i !== index);
                cardElement.classList.remove('selected');
                updateBasket();
                return;
            }

            if (item.isNew) {
                // 올바른 선택
                selectedItems.push(index);
                cardElement.classList.add('selected');
                cardElement.classList.remove('wrong');

                // 5개 다 선택하면 완료
                if (selectedItems.length === 5) {
                    setTimeout(() => finishGame(), 500);
                }
            } else {
                // 틀린 선택
                cardElement.classList.add('wrong');
                setTimeout(() => {
                    cardElement.classList.remove('wrong');
                }, 1000);
            }

            updateBasket();
        }

        function updateBasket() {
            const basketItems = document.getElementById('basketItems');
            const selectedCount = document.getElementById('selectedCount');

            if (selectedItems.length === 0) {
                basketItems.innerHTML = '<div style="color: #3d2817; font-size: 1em;">아직 아무것도 없어요</div>';
            } else {
                basketItems.innerHTML = selectedItems.map(idx => {
                    const item = items[idx];
                    return `
                        <div class="basket-item">
                            <div>${item.emoji}</div>
                            <div class="basket-item-label">${item.name}</div>
                        </div>
                    `;
                }).join('');
            }

            selectedCount.textContent = selectedItems.length;
        }

        function finishGame() {
            document.querySelector('.game-area').style.opacity = '0.5';
            document.getElementById('resultArea').classList.add('show');
        }

        // 초기화
        document.addEventListener('DOMContentLoaded', () => {
            renderItems();
        });
    </script>
</body>
</html>
