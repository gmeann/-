<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>송편 공방 - 한가위 어드벤처</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(180deg, #f5e6d3 0%, #e8d4b8 50%, #dfc39e 100%);
            background-image: url('../../../assets/chuseok/songpyeon/background/workshop-bg.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #3d2817;
        }

        .container {
            max-width: 900px;
            width: 100%;
        }

        .back-btn {
            display: inline-block;
            padding: 10px 20px;
            background: rgba(61, 40, 23, 0.2);
            color: #3d2817;
            border: none;
            border-radius: 50px;
            margin-bottom: 20px;
            font-size: 0.95em;
            cursor: pointer;
            transition: all 0.3s;
        }

        .back-btn:hover {
            background: rgba(61, 40, 23, 0.3);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 15px;
            color: #8b4513;
        }

        /* Progress Indicator */
        .progress-bar {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .progress-dot {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.4);
            border: 3px solid #8b4513;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2em;
            transition: all 0.3s;
        }

        .progress-dot.active {
            background: #ffd700;
            border-color: #b8860b;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
        }

        .progress-dot.completed {
            background: #4caf50;
            border-color: #45a049;
        }

        /* Game Area */
        .game-area {
            background: rgba(255, 255, 255, 0.85);
            border-radius: 30px;
            padding: 40px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            min-height: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(2px);
        }

        .step {
            display: none;
            width: 100%;
            text-align: center;
        }

        .step.active {
            display: block;
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .character {
            font-size: 6em;
            margin-bottom: 20px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .dialogue {
            font-size: 1.3em;
            color: #3d2817;
            margin-bottom: 30px;
            font-weight: 500;
            line-height: 1.6;
        }

        /* Step 1: Choose dough */
        .dough-options {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .dough-btn {
            width: 100px;
            height: 100px;
            border: 3px solid #8b4513;
            border-radius: 20px;
            cursor: pointer;
            font-size: 3em;
            transition: all 0.3s;
            background: white;
        }

        .dough-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .dough-btn.selected {
            border-color: #ffd700;
            background: rgba(255, 215, 0, 0.2);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
            animation: pulse 0.5s ease-out;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }

        /* Step 2: Add filling */
        .dough-display {
            font-size: 5em;
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .filling-options {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .filling-btn {
            width: 80px;
            height: 80px;
            border: 2px solid #8b4513;
            border-radius: 15px;
            cursor: pointer;
            font-size: 2.5em;
            transition: all 0.3s;
            background: white;
        }

        .filling-btn:hover {
            transform: scale(1.1);
        }

        .filling-btn.selected {
            border-color: #ffd700;
            background: rgba(255, 215, 0, 0.2);
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
        }

        /* Step 3: Shape songpyeon */
        .songpyeon-shape {
            font-size: 6em;
            margin: 30px 0;
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
        }

        .songpyeon-shape:hover {
            transform: scale(1.05);
        }

        .tap-count {
            font-size: 1.1em;
            color: #8b4513;
            margin-top: 15px;
        }

        /* Action Buttons */
        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 30px;
        }

        button {
            padding: 12px 30px;
            font-size: 1.05em;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
        }

        .success-btn {
            background: #4caf50;
            color: white;
        }

        .success-btn:hover {
            background: #45a049;
            transform: scale(1.05);
        }

        /* Result Screen */
        .result-screen {
            display: none;
            text-align: center;
        }

        .result-screen.show {
            display: block;
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-title {
            font-size: 2.2em;
            color: #4caf50;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .result-message {
            font-size: 1.1em;
            color: #3d2817;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .result-emoji {
            font-size: 5em;
            margin: 20px 0;
        }

        /* Fact Box */
        .fact-box {
            background: rgba(255, 215, 0, 0.15);
            border: 2px solid rgba(255, 215, 0, 0.6);
            border-radius: 15px;
            padding: 20px;
            margin-top: 25px;
            text-align: left;
            font-size: 1em;
            color: #3d2817;
        }

        .fact-box strong {
            display: block;
            margin-bottom: 10px;
            font-size: 1.1em;
        }

        .learn-more-btn {
            padding: 10px 20px;
            background: rgba(255, 215, 0, 0.3);
            color: #8b4513;
            border: 2px solid rgba(255, 215, 0, 0.6);
            border-radius: 25px;
            font-size: 0.95em;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 15px;
        }

        .learn-more-btn:hover {
            background: rgba(255, 215, 0, 0.5);
            transform: scale(1.05);
        }

        /* Reward */
        .moon-fragment {
            font-size: 3em;
            animation: float 3s ease-in-out infinite;
            margin-top: 20px;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8em;
            }

            .game-area {
                padding: 25px;
                min-height: 350px;
            }

            .character {
                font-size: 4em;
            }

            .dough-display {
                font-size: 3.5em;
            }

            .songpyeon-shape {
                font-size: 4em;
            }

            .dialogue {
                font-size: 1.1em;
            }

            .progress-dot {
                width: 40px;
                height: 40px;
                font-size: 1em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <button class="back-btn" onclick="goBack()">← 돌아가기</button>
            <h1>🍡 송편 공방</h1>
        </div>

        <!-- Progress Bar -->
        <div class="progress-bar" id="progressBar"></div>

        <!-- Game Area -->
        <div class="game-area">
            <!-- Step 0: Welcome -->
            <div class="step active" id="step-0">
                <div class="character">🧚</div>
                <div class="dialogue">달님에게 맛있는 송편을 만들어 줄래?</div>
                <div class="action-buttons">
                    <button class="success-btn" onclick="startGame()">🍡 송편 만들기</button>
                </div>
            </div>

            <!-- Step 1: Choose Dough -->
            <div class="step" id="step-1">
                <div class="character">🧚</div>
                <div class="dialogue">송편 반죽을 골라 볼까요?</div>
                <div class="dough-options">
                    <button class="dough-btn" onclick="chooseDough('white')">⚪</button>
                    <button class="dough-btn" onclick="chooseDough('yellow')">🟡</button>
                    <button class="dough-btn" onclick="chooseDough('green')">🟢</button>
                </div>
            </div>

            <!-- Step 2: Add Filling -->
            <div class="step" id="step-2">
                <div class="dough-display" id="doughDisplay">⚪</div>
                <div class="dialogue">이번에는 송편 속을 넣어 볼까요?</div>
                <div class="filling-options">
                    <button class="filling-btn" onclick="addFilling('redbean')">🫘</button>
                    <button class="filling-btn" onclick="addFilling('sesame')">🌰</button>
                </div>
            </div>

            <!-- Step 3: Shape Songpyeon -->
            <div class="step" id="step-3">
                <div class="dialogue">꾹꾹 눌러 송편을 만들어 주세요!</div>
                <div class="songpyeon-shape" id="songpyeonShape" onclick="tapSongpyeon()">⚪</div>
                <div class="tap-count" id="tapCount">남은 탭: 3회</div>
            </div>

            <!-- Step 4: Fact Box -->
            <div class="step" id="step-4">
                <div class="dough-display">🍡</div>
                <div class="dialogue">추석에는 송편을 먹어요.</div>
                <div class="fact-box">
                    <strong>🍡 송편</strong>
                    송편은 솔잎을 깔고 쪄 먹기도 해요. 솔잎의 향긋한 냄새가 송편에 베어나답니다.
                    <button class="learn-more-btn" onclick="openFactCheck('songpyeon')">📖 더 알아보기</button>
                </div>
                <div class="action-buttons">
                    <button class="success-btn" onclick="nextStep()">다음 →</button>
                </div>
            </div>

            <!-- Step 5: Success & Reward -->
            <div class="step" id="step-5">
                <div class="character">🧚</div>
                <div class="result-screen show">
                    <div class="result-title">🎉 송편 완성!</div>
                    <div class="result-emoji">🍡</div>
                    <div class="result-message">맛있는 송편을 만들어 줘서 고마워!</div>
                    <div class="moon-fragment">🌕</div>
                    <div class="result-message" style="color: #ffd700; font-weight: bold;">달 조각을 얻었어요!</div>
                </div>
                <div class="action-buttons">
                    <button class="success-btn" onclick="completeGame()">🏘️ 마을로 돌아가기</button>
                    <button class="success-btn" onclick="resetGame()">🔄 다시 해보기</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'track-a-progress';
        const GAME_COMPLETE_KEY = 'track-a-game-2-complete';
        let currentStep = 0;
        let selectedDough = null;
        let tapCount = 3;
        let gameAlreadyCompleted = false;

        function initProgress() {
            const progressBar = document.getElementById('progressBar');
            progressBar.innerHTML = '';
            const totalSteps = 3;

            for (let i = 0; i < totalSteps; i++) {
                const dot = document.createElement('div');
                dot.className = 'progress-dot';

                if (i < currentStep) {
                    dot.classList.add('completed');
                    dot.textContent = '●';
                } else if (i === currentStep) {
                    dot.classList.add('active');
                    dot.textContent = '●';
                } else {
                    dot.textContent = '○';
                }

                progressBar.appendChild(dot);
            }
        }

        function showStep(stepIndex) {
            document.querySelectorAll('.step').forEach((step, idx) => {
                step.classList.toggle('active', idx === stepIndex);
            });

            if (stepIndex >= 1 && stepIndex <= 3) {
                initProgress();
            }
        }

        function startGame() {
            currentStep = 1;
            showStep(currentStep);
        }

        function chooseDough(color) {
            selectedDough = color;

            const colorMap = {
                'white': '⚪',
                'yellow': '🟡',
                'green': '🟢'
            };

            // Show feedback
            document.querySelectorAll('.dough-btn').forEach(btn => btn.classList.remove('selected'));
            event.target.classList.add('selected');

            setTimeout(() => {
                document.getElementById('doughDisplay').textContent = colorMap[color];
                currentStep = 2;
                showStep(currentStep);
            }, 600);
        }

        function addFilling(type) {
            event.target.classList.add('selected');

            setTimeout(() => {
                currentStep = 3;
                tapCount = 3;
                showStep(currentStep);
                updateTapCount();
            }, 600);
        }

        function tapSongpyeon() {
            if (tapCount <= 0) return;

            const shapes = ['⚪', '🌙', '🍡'];
            const shapesIdx = 3 - tapCount;

            document.getElementById('songpyeonShape').textContent = shapes[shapesIdx];
            tapCount--;

            if (tapCount <= 0) {
                setTimeout(() => {
                    currentStep = 4;
                    showStep(currentStep);
                }, 300);
            } else {
                updateTapCount();
            }
        }

        function updateTapCount() {
            document.getElementById('tapCount').textContent = `남은 탭: ${tapCount}회`;
        }

        function nextStep() {
            currentStep = 5;
            showStep(currentStep);
        }

        function resetGame() {
            // 게임 상태만 초기화 (보상 상태는 유지)
            currentStep = 0;
            selectedDough = null;
            tapCount = 3;
            showStep(currentStep);
        }

        function completeGame() {
            // Prevent duplicate rewards
            if (gameAlreadyCompleted) {
                window.location.href = '../';
                return;
            }

            // Save progress
            const progress = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {
                games: [false, false, false, false]
            };
            progress.games[1] = true;
            localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
            localStorage.setItem(GAME_COMPLETE_KEY, 'true');

            // Award moon piece
            const MOON_PIECES_KEY = 'track-a-moon-pieces';
            const moonPieces = JSON.parse(localStorage.getItem(MOON_PIECES_KEY)) || {
                songpyeon: false,
                play: false,
                harvest: false
            };
            if (!moonPieces.songpyeon) {
                moonPieces.songpyeon = true;
                localStorage.setItem(MOON_PIECES_KEY, JSON.stringify(moonPieces));
            }

            gameAlreadyCompleted = true;
            window.location.href = '../';
        }

        function goBack() {
            window.location.href = '../';
        }

        // Check if already completed
        if (localStorage.getItem(GAME_COMPLETE_KEY)) {
            gameAlreadyCompleted = true;
        }

        initProgress();
    </script>
    <script src="../../fact-check.js"></script>
</body>
</html>
