<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사건 01 - 한가위 어드벤처</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(180deg, #f5e6d3 0%, #e8d4b8 50%, #dfc39e 100%);
            min-height: 100vh;
            padding: 20px;
            color: #3d2817;
            animation: fadeInBody 0.8s ease-out;
        }

        @keyframes fadeInBody {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            margin-bottom: 40px;
        }

        .back-btn {
            display: inline-block;
            padding: 10px 20px;
            background: rgba(139, 69, 19, 0.2);
            color: #3d2817;
            text-decoration: none;
            border-radius: 50px;
            font-size: 0.95em;
            transition: all 0.3s;
            border: none;
            cursor: pointer;
            margin-bottom: 20px;
        }

        .back-btn:hover {
            background: rgba(139, 69, 19, 0.3);
            transform: translateX(-5px);
        }

        .header-title {
            font-size: 2em;
            color: #8b4513;
            font-weight: bold;
        }

        /* Claim Card */
        .claim-section {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.95), rgba(245, 230, 211, 0.9));
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 40px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            animation: slideUp 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .claim-label {
            font-size: 0.95em;
            color: #5d3a1a;
            margin-bottom: 12px;
            font-weight: bold;
        }

        .claim-text {
            font-size: 1.3em;
            color: #3d2817;
            line-height: 1.8;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .claim-instruction {
            font-size: 0.95em;
            color: #666;
            margin-top: 15px;
        }

        /* Sources Grid */
        .sources-section {
            margin-bottom: 40px;
        }

        .sources-label {
            font-size: 1.1em;
            color: #5d3a1a;
            margin-bottom: 20px;
            font-weight: bold;
            text-align: center;
        }

        .sources-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        /* Source Card */
        .source-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.08);
            border: 2px solid transparent;
            animation: slideUp 0.8s ease-out;
        }

        .source-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        .source-card.viewed {
            border-color: #4caf50;
            background: rgba(76, 175, 80, 0.05);
        }

        .source-icon {
            font-size: 3em;
            margin-bottom: 15px;
            display: block;
        }

        .source-title {
            font-size: 1.1em;
            color: #8b4513;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .source-category {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 15px;
        }

        .source-button {
            padding: 10px 20px;
            background: #8b4513;
            color: white;
            border: none;
            border-radius: 20px;
            font-size: 0.95em;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
            width: 100%;
        }

        .source-button:hover {
            background: #a0522d;
        }

        .view-badge {
            display: inline-block;
            background: #4caf50;
            color: white;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.85em;
            margin-top: 10px;
            font-weight: bold;
        }

        /* Completion Message */
        .completion-section {
            display: none;
            background: linear-gradient(135deg, rgba(76, 175, 80, 0.1), rgba(100, 200, 100, 0.08));
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
            text-align: center;
            border: 2px solid #4caf50;
            animation: slideUp 0.8s ease-out;
        }

        .completion-section.show {
            display: block;
        }

        .completion-title {
            font-size: 1.2em;
            color: #2e7d32;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .completion-text {
            font-size: 1.05em;
            color: #3d2817;
            line-height: 1.7;
        }

        /* Next Button */
        .next-button-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .next-button {
            padding: 15px 40px;
            background: linear-gradient(135deg, #8b4513, #a0522d);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(139, 69, 19, 0.3);
            display: none;
        }

        .next-button.show {
            display: inline-block;
        }

        .next-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(139, 69, 19, 0.4);
        }

        .next-button:active {
            transform: translateY(-1px);
        }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1000;
            animation: fadeIn 0.3s ease-out;
        }

        .modal-overlay.show {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background: white;
            border-radius: 20px;
            padding: 35px;
            max-width: 600px;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: modalSlideUp 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes modalSlideUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #e0e0e0;
        }

        .modal-icon {
            font-size: 2.5em;
        }

        .modal-title {
            font-size: 1.4em;
            color: #8b4513;
            font-weight: bold;
        }

        .modal-category {
            font-size: 0.9em;
            color: #666;
            display: block;
        }

        .modal-body {
            margin-bottom: 25px;
            line-height: 1.8;
            white-space: pre-wrap;
            color: #3d2817;
            font-size: 1em;
        }

        .modal-source {
            font-size: 0.9em;
            color: #666;
            border-top: 1px solid #e0e0e0;
            padding-top: 15px;
            margin-bottom: 20px;
        }

        .modal-close {
            padding: 12px 30px;
            background: #8b4513;
            color: white;
            border: none;
            border-radius: 20px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
            font-weight: bold;
        }

        .modal-close:hover {
            background: #a0522d;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header-title {
                font-size: 1.5em;
            }

            .sources-grid {
                grid-template-columns: 1fr;
            }

            .source-card {
                padding: 20px;
            }

            .claim-section {
                padding: 20px;
            }

            .claim-text {
                font-size: 1.1em;
            }

            .modal-content {
                margin: 20px;
                max-height: 90vh;
            }
        }

        @media (max-width: 480px) {
            .header-title {
                font-size: 1.3em;
            }

            .claim-text {
                font-size: 1em;
            }

            .source-icon {
                font-size: 2.5em;
            }

            .source-card {
                padding: 15px;
            }

            .next-button {
                padding: 12px 30px;
                font-size: 1em;
            }

            .modal-content {
                padding: 25px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <button class="back-btn" onclick="goBack()">← 기록실</button>
            <h1 class="header-title">🗂️ 사건 01</h1>
        </div>

        <!-- Claim Section -->
        <div class="claim-section">
            <div class="claim-label">🔎 조사할 주장</div>
            <div class="claim-text" id="claimText"></div>
            <div class="claim-instruction">이 주장을 자료를 통해 확인해 보세요.</div>
        </div>

        <!-- Sources Section -->
        <div class="sources-section">
            <div class="sources-label">📚 추석에 관한 자료들</div>
            <div class="sources-grid" id="sourcesGrid"></div>
        </div>

        <!-- Completion Section -->
        <div class="completion-section" id="completionSection">
            <div class="completion-title">✓ 자료를 모두 살펴보았어요.</div>
            <div class="completion-text">
                이제 어떤 자료가 이 주장을 뒷받침하는지 생각해 볼까요?
            </div>
        </div>

        <!-- Next Button -->
        <div class="next-button-section">
            <button class="next-button" id="nextButton" onclick="proceedToEvidence()">근거 찾아보기 →</button>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-header">
                <span class="modal-icon" id="modalIcon"></span>
                <div>
                    <div class="modal-title" id="modalTitle"></div>
                    <span class="modal-category" id="modalCategory"></span>
                </div>
            </div>
            <div class="modal-body" id="modalBody"></div>
            <div class="modal-source" id="modalSource"></div>
            <button class="modal-close" onclick="closeModal()">닫기</button>
        </div>
    </div>

    <script src="archive-cases.js"></script>
    <script>
        let currentCase = null;
        let viewedSources = [];

        // Initialize
        function init() {
            currentCase = getCurrentCase();
            if (!currentCase) {
                alert('사건 정보를 불러올 수 없습니다.');
                goBack();
                return;
            }

            // Render claim
            document.getElementById('claimText').textContent = currentCase.claim;

            // Render sources
            renderSources();
        }

        // Render source cards
        function renderSources() {
            const grid = document.getElementById('sourcesGrid');
            grid.innerHTML = '';

            currentCase.sources.forEach(source => {
                const card = document.createElement('div');
                card.className = 'source-card';
                if (viewedSources.includes(source.id)) {
                    card.classList.add('viewed');
                }

                card.innerHTML = `
                    <span class="source-icon">${source.icon}</span>
                    <div class="source-title">${source.title}</div>
                    <div class="source-category">${source.category}</div>
                    <button class="source-button" onclick="openSourceModal('${source.id}')">
                        자료 열기
                    </button>
                    ${viewedSources.includes(source.id) ? '<div class="view-badge">✓ 확인함</div>' : ''}
                `;

                grid.appendChild(card);
            });
        }

        // Open source modal
        function openSourceModal(sourceId) {
            const source = currentCase.sources.find(s => s.id === sourceId);
            if (!source) return;

            document.getElementById('modalIcon').textContent = source.icon;
            document.getElementById('modalTitle').textContent = source.title;
            document.getElementById('modalCategory').textContent = source.category;
            document.getElementById('modalBody').textContent = source.content;

            let sourceInfo = `출처: ${source.sourceName || source.sourceType || ''}`;
            document.getElementById('modalSource').textContent = sourceInfo;

            // Mark as viewed
            if (!viewedSources.includes(sourceId)) {
                viewedSources.push(sourceId);
            }

            // Show modal
            document.getElementById('modalOverlay').classList.add('show');
        }

        // Close modal
        function closeModal(event) {
            if (event && event.target !== event.currentTarget) return;

            document.getElementById('modalOverlay').classList.remove('show');

            // Update UI
            renderSources();
            updateCompletion();
        }

        // Update completion status
        function updateCompletion() {
            const allViewed = currentCase.sources.every(s => viewedSources.includes(s.id));

            if (allViewed) {
                document.getElementById('completionSection').classList.add('show');
                document.getElementById('nextButton').classList.add('show');
            } else {
                document.getElementById('completionSection').classList.remove('show');
                document.getElementById('nextButton').classList.remove('show');
            }
        }

        // Proceed to evidence selection (Phase 7-3)
        function proceedToEvidence() {
            // Placeholder for Phase 7-3
            alert('근거 선택 화면은 다음 단계에서 준비될 예정입니다.');
            // window.location.href = 'evidence-selection.html';
        }

        // Go back to archive
        function goBack() {
            window.location.href = '07-archive.html';
        }

        // Initialize on page load
        init();
    </script>
</body>
</html>
