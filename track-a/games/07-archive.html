<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>한가위 어드벤처</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(180deg, #f5e6d3 0%, #e8d4b8 50%, #dfc39e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #3d2817;
        }

        .container {
            max-width: 1000px;
            width: 100%;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 50px;
        }

        h1 {
            font-size: 3em;
            margin-bottom: 10px;
            color: #8b4513;
        }

        .subtitle {
            font-size: 1.3em;
            color: #5d3a1a;
            margin-bottom: 5px;
        }

        .welcome-msg {
            font-size: 1.1em;
            color: #666;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        /* Progress Section */
        .progress-section {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 25px;
            padding: 40px;
            margin-bottom: 40px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .progress-title {
            font-size: 1.5em;
            color: #8b4513;
            font-weight: 600;
            margin-bottom: 25px;
        }

        /* Moon Progress */
        .moon-progress {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .moon-dot {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.6);
            border: 4px solid #d4a574;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2em;
            transition: all 0.5s;
        }

        .moon-dot.completed {
            background: linear-gradient(135deg, #ffeb3b, #ffc107);
            border-color: #8b4513;
            box-shadow: 0 0 20px rgba(255, 193, 7, 0.6);
            transform: scale(1.1);
        }

        .moon-count {
            font-size: 1.3em;
            color: #3d2817;
            font-weight: 600;
            margin-bottom: 20px;
        }

        /* Completion Message */
        .completion-box {
            display: none;
            background: rgba(76, 175, 80, 0.1);
            border: 2px solid rgba(76, 175, 80, 0.6);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            text-align: center;
        }

        .completion-box.show {
            display: block;
            animation: popIn 0.5s ease-out;
        }

        @keyframes popIn {
            0% {
                opacity: 0;
                transform: scale(0.9);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .completion-icon {
            font-size: 3em;
            margin-bottom: 15px;
            animation: bounce 1s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .completion-text {
            font-size: 1.2em;
            color: #2e7d32;
            font-weight: 600;
        }

        /* Games Grid */
        .games-title {
            font-size: 1.5em;
            color: #8b4513;
            font-weight: 600;
            margin-bottom: 25px;
            text-align: center;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .game-link {
            background: white;
            border: 3px solid #d4a574;
            border-radius: 20px;
            padding: 30px;
            text-decoration: none;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .game-link:hover {
            transform: translateY(-8px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
            border-color: #ffd700;
        }

        .game-link.completed {
            background: rgba(76, 175, 80, 0.1);
            border-color: #4caf50;
        }

        .game-link.completed::after {
            content: "✓";
            position: absolute;
            top: -10px;
            right: -10px;
            width: 40px;
            height: 40px;
            background: #4caf50;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.3em;
        }

        .game-icon {
            font-size: 3em;
        }

        .game-name {
            font-size: 1.2em;
            color: #8b4513;
            font-weight: 600;
        }

        .game-desc {
            font-size: 0.9em;
            color: #666;
        }

        /* Info Box */
        .info-box {
            background: rgba(255, 215, 0, 0.15);
            border: 2px solid rgba(255, 215, 0, 0.6);
            border-radius: 20px;
            padding: 25px;
            text-align: center;
            margin-top: 30px;
        }

        .info-title {
            font-size: 1.1em;
            color: #8b4513;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .info-text {
            font-size: 1em;
            color: #3d2817;
            line-height: 1.6;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2em;
            }

            .games-grid {
                grid-template-columns: 1fr;
            }

            .moon-dot {
                width: 60px;
                height: 60px;
                font-size: 1.5em;
            }

            .progress-section {
                padding: 25px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>🌙 한가위 어드벤처</h1>
            <div class="subtitle">달님과 함께하는 한가위</div>
            <div class="welcome-msg">네 가지 게임을 완료하고 보름달을 완성해요!</div>
        </div>

        <!-- Progress Section -->
        <div class="progress-section">
            <div class="progress-title">🌙 달 조각 모으기</div>

            <!-- Moon Progress Display -->
            <div class="moon-progress" id="moonProgress">
                <div class="moon-dot">🌑</div>
                <div class="moon-dot">🌑</div>
                <div class="moon-dot">🌑</div>
                <div class="moon-dot">🌑</div>
            </div>

            <div class="moon-count">완료: <span id="completedCount">0</span>/4개</div>

            <!-- Completion Box -->
            <div class="completion-box" id="completionBox">
                <div class="completion-icon">🌕</div>
                <div class="completion-text">모든 게임을 완료했어요! 보름달이 떠올랐어요!</div>
            </div>
        </div>

        <!-- Games Section -->
        <div class="games-title">🎮 선택해서 시작해보세요!</div>
        <div class="games-grid">
            <a href="01-find-moon.html" class="game-link" id="game1">
                <div class="game-icon">🌕</div>
                <div class="game-name">달님을 찾아라</div>
                <div class="game-desc">보름달을 찾아요</div>
            </a>

            <a href="02-songpyeon.html" class="game-link" id="game2">
                <div class="game-icon">🍡</div>
                <div class="game-name">송편 공방</div>
                <div class="game-desc">송편을 만들어요</div>
            </a>

            <a href="03-games.html" class="game-link" id="game3">
                <div class="game-icon">🎉</div>
                <div class="game-name">놀이마당</div>
                <div class="game-desc">전통 놀이를 해요</div>
            </a>

            <a href="04-harvest.html" class="game-link" id="game4">
                <div class="game-icon">🌾</div>
                <div class="game-name">풍년 바구니</div>
                <div class="game-desc">햇곡식을 고르아요</div>
            </a>
        </div>

        <!-- Info Box -->
        <div class="info-box">
            <div class="info-title">💡 추석이란?</div>
            <div class="info-text">
                음력 8월 15일(한가위)은 추석이에요.<br>
                가족이 함께 모여 맛있는 음식을 나누고<br>
                즐거운 놀이를 하는 우리의 아름다운 명절입니다.
            </div>
        </div>
    </div>

    <script>
        function updateProgress() {
            const state = JSON.parse(localStorage.getItem('gameCompletionState') || '{}');

            // 완료된 게임 개수 계산
            const completed = [
                state.findmoon,
                state.songpyeon,
                state.games,
                state.harvest
            ].filter(Boolean).length;

            document.getElementById('completedCount').textContent = completed;

            // 달 진행도 업데이트
            const moonDots = document.querySelectorAll('.moon-dot');
            moonDots.forEach((dot, idx) => {
                dot.classList.toggle('completed', idx < completed);
                if (idx < completed) {
                    dot.textContent = '🌕';
                } else {
                    dot.textContent = '🌑';
                }
            });

            // 게임 완료 표시
            if (state.findmoon) document.getElementById('game1').classList.add('completed');
            if (state.songpyeon) document.getElementById('game2').classList.add('completed');
            if (state.games) document.getElementById('game3').classList.add('completed');
            if (state.harvest) document.getElementById('game4').classList.add('completed');

            // 모두 완료 시 메시지 표시
            if (completed === 4) {
                document.getElementById('completionBox').classList.add('show');
            }
        }

        // 각 게임 저장 상태 설정
        function markGameComplete(gameName) {
            const state = JSON.parse(localStorage.getItem('gameCompletionState') || '{}');
            state[gameName] = true;
            localStorage.setItem('gameCompletionState', JSON.stringify(state));
        }

        // 페이지 로드 시 진행도 업데이트
        document.addEventListener('DOMContentLoaded', updateProgress);

        // 페이지 보이기/숨기기 이벤트
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) {
                updateProgress();
            }
        });
    </script>
</body>
</html>
