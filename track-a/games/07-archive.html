<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>한가위 기록실 - 한가위 어드벤처</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(180deg, #f5e6d3 0%, #e8d4b8 50%, #dfc39e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #3d2817;
            animation: fadeInBody 0.8s ease-out;
        }

        @keyframes fadeInBody {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .container {
            max-width: 1000px;
            width: 100%;
        }

        /* Header Section */
        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .back-btn {
            display: inline-block;
            padding: 10px 20px;
            background: rgba(139, 69, 19, 0.2);
            color: #3d2817;
            text-decoration: none;
            border-radius: 50px;
            margin-bottom: 20px;
            font-size: 0.95em;
            transition: all 0.3s;
            border: none;
            cursor: pointer;
        }

        .back-btn:hover {
            background: rgba(139, 69, 19, 0.3);
            transform: translateX(-5px);
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            color: #8b4513;
        }

        .subtitle {
            font-size: 1.2em;
            color: #5d3a1a;
            margin-bottom: 5px;
        }

        /* Archive Room Main Section */
        .archive-room {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.9), rgba(245, 230, 211, 0.8));
            border-radius: 30px;
            padding: 60px 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            text-align: center;
            animation: slideUp 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            margin-bottom: 30px;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .archive-icon {
            font-size: 5em;
            margin-bottom: 20px;
            display: block;
            animation: popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.2s backwards;
        }

        @keyframes popIn {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .archive-title {
            font-size: 2.2em;
            color: #8b4513;
            margin-bottom: 15px;
            font-weight: bold;
            animation: fadeIn 0.6s ease-out 0.3s backwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .archive-welcome {
            font-size: 1.3em;
            color: #5d3a1a;
            margin-bottom: 30px;
            line-height: 1.6;
            animation: fadeIn 0.6s ease-out 0.4s backwards;
        }

        /* First Case Button */
        .case-button {
            display: inline-block;
            padding: 18px 40px;
            background: linear-gradient(135deg, #8b4513, #a0522d);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(139, 69, 19, 0.3);
            margin-top: 20px;
            animation: fadeIn 0.6s ease-out 0.5s backwards;
        }

        .case-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(139, 69, 19, 0.4);
            background: linear-gradient(135deg, #a0522d, #8b4513);
        }

        .case-button:active {
            transform: translateY(-1px);
        }

        /* Case Card Grid Container */
        .case-card-container {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.08);
            text-align: center;
            animation: slideUp 0.8s ease-out;
        }

        .case-card-front,
        .case-card-completed {
            display: none;
        }

        /* Case Card (Completion Info) */
        .case-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-top: 30px;
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.08);
            text-align: center;
            animation: slideUp 0.8s ease-out;
        }

        .case-card-title {
            font-size: 1.1em;
            color: #8b4513;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .case-card-description {
            font-size: 0.95em;
            color: #5d3a1a;
            margin-bottom: 15px;
            line-height: 1.6;
        }

        .case-card-completion {
            font-size: 0.9em;
            color: #4caf50;
            font-weight: bold;
            margin-top: 12px;
        }

        .case-card-record {
            font-size: 0.85em;
            color: #8b4513;
            margin-top: 8px;
        }

        /* Guide Text */
        .guide-text {
            background: rgba(255, 255, 255, 0.7);
            border-left: 4px solid #8b4513;
            border-radius: 10px;
            padding: 20px 25px;
            margin-top: 30px;
            font-size: 1em;
            color: #5d3a1a;
            line-height: 1.7;
            animation: slideUp 0.8s ease-out 0.6s backwards;
        }

        .guide-text strong {
            color: #8b4513;
            font-weight: bold;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            h1 {
                font-size: 1.8em;
            }

            .archive-room {
                padding: 40px 25px;
                border-radius: 20px;
            }

            .archive-icon {
                font-size: 4em;
                margin-bottom: 15px;
            }

            .archive-title {
                font-size: 1.8em;
                margin-bottom: 12px;
            }

            .archive-welcome {
                font-size: 1.1em;
                margin-bottom: 25px;
            }

            .case-button {
                padding: 15px 35px;
                font-size: 1.05em;
                width: 100%;
                max-width: 400px;
            }

            .guide-text {
                font-size: 0.95em;
                padding: 15px 20px;
                margin-top: 25px;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 1.5em;
                margin-bottom: 8px;
            }

            .archive-room {
                padding: 30px 20px;
                border-radius: 15px;
            }

            .archive-icon {
                font-size: 3.5em;
                margin-bottom: 12px;
            }

            .archive-title {
                font-size: 1.5em;
                margin-bottom: 10px;
            }

            .archive-welcome {
                font-size: 1em;
                margin-bottom: 20px;
            }

            .case-button {
                padding: 14px 30px;
                font-size: 1em;
            }

            .guide-text {
                font-size: 0.9em;
                padding: 12px 15px;
                margin-top: 20px;
            }

            .back-btn {
                padding: 8px 16px;
                font-size: 0.9em;
                margin-bottom: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <button class="back-btn" onclick="goBack()">← 한가위 마을</button>
            <h1>🗂️ 한가위 기록실</h1>
        </div>

        <!-- Archive Room Main Section -->
        <div class="archive-room" id="archiveRoom">
            <span class="archive-icon">🗂️</span>
            <h2 class="archive-title">한가위 기록실</h2>
            <p class="archive-welcome">추석에 대한 이야기를<br>자료로 확인해 볼까요?</p>
        </div>

        <!-- Cases Grid -->
        <div class="village-grid">
            <!-- Case 01 -->
            <div class="case-card-container">
                <div class="case-card-front" id="caseCard01Front">
                    <div class="case-card-title">사건 01</div>
                    <div class="case-card-description">
                        추석은 아주 오래전부터<br>
                        지금과 같은 모습이었을까?
                    </div>
                    <button class="case-button" onclick="startCase('case-01.html')">🔎 조사하기</button>
                </div>
                <div class="case-card-completed" id="caseCard01Completed" style="display: none;">
                    <div class="case-card-title">사건 01</div>
                    <div class="case-card-description">
                        추석은 아주 오래전부터<br>
                        지금과 같은 모습이었을까?
                    </div>
                    <div class="case-card-completion">
                        ✓ 조사 완료
                    </div>
                    <div class="case-card-record">
                        📚 기록 카드 획득
                    </div>
                </div>
            </div>

            <!-- Case 02 -->
            <div class="case-card-container">
                <div class="case-card-front" id="caseCard02Front">
                    <div class="case-card-title">사건 02</div>
                    <div class="case-card-description">
                        차례상에는 반드시<br>
                        정해진 규칙이 있을까?
                    </div>
                    <button class="case-button" onclick="startCase('case-02.html')">🔎 조사하기</button>
                </div>
                <div class="case-card-completed" id="caseCard02Completed" style="display: none;">
                    <div class="case-card-title">사건 02</div>
                    <div class="case-card-description">
                        차례상에는 반드시<br>
                        정해진 규칙이 있을까?
                    </div>
                    <div class="case-card-completion">
                        ✓ 조사 완료
                    </div>
                    <div class="case-card-record">
                        📚 기록 카드 획득
                    </div>
                </div>
            </div>
        </div>

        <!-- Guide Text -->
        <div class="guide-text">
            <strong>💡 팁:</strong> 자료를 읽고, <strong>어떤 근거로 그렇게 말할 수 있는지</strong> 생각해 보세요.
        </div>
    </div>

    <script>
        // Load completion state
        let caseCompletionState = {};

        function loadCompletionState() {
            const saved = localStorage.getItem('caseCompletionState');
            if (saved) {
                caseCompletionState = JSON.parse(saved);
            }
            updateCaseDisplay();
        }

        function updateCaseDisplay() {
            // Update case 01 display
            const case01Front = document.getElementById('caseCard01Front');
            const case01Completed = document.getElementById('caseCard01Completed');
            if (caseCompletionState.case01) {
                if (case01Front) case01Front.style.display = 'none';
                if (case01Completed) case01Completed.style.display = 'block';
            } else {
                if (case01Front) case01Front.style.display = 'block';
                if (case01Completed) case01Completed.style.display = 'none';
            }

            // Update case 02 display
            const case02Front = document.getElementById('caseCard02Front');
            const case02Completed = document.getElementById('caseCard02Completed');
            if (caseCompletionState.case02) {
                if (case02Front) case02Front.style.display = 'none';
                if (case02Completed) case02Completed.style.display = 'block';
            } else {
                if (case02Front) case02Front.style.display = 'block';
                if (case02Completed) case02Completed.style.display = 'none';
            }
        }

        function goBack() {
            window.location.href = '../';
        }

        function startCase(caseFile) {
            window.location.href = caseFile;
        }

        // Load and update on page load
        window.addEventListener('load', loadCompletionState);
    </script>
</body>
</html>
