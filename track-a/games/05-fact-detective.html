<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>추석 팩트 탐정 - 한가위 어드벤처</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(180deg, #f5e6d3 0%, #e8d4b8 50%, #dfc39e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #3d2817;
        }

        .container {
            max-width: 900px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .back-btn {
            display: inline-block;
            padding: 10px 20px;
            background: rgba(139, 69, 19, 0.2);
            color: #3d2817;
            text-decoration: none;
            border-radius: 50px;
            margin-bottom: 20px;
            font-size: 0.95em;
            transition: all 0.3s;
            border: none;
            cursor: pointer;
        }

        .back-btn:hover {
            background: rgba(139, 69, 19, 0.3);
            transform: translateX(-5px);
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            color: #8b4513;
        }

        .subtitle {
            font-size: 1.2em;
            color: #5d3a1a;
            margin-bottom: 5px;
        }

        .tagline {
            font-size: 1.1em;
            color: #7a4a2a;
        }

        /* Screen: Entry */
        .screen {
            display: none;
            animation: fadeIn 0.5s ease-out;
        }

        .screen.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .entry-screen {
            text-align: center;
            background: white;
            border-radius: 25px;
            padding: 50px 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .research-icon {
            font-size: 6em;
            margin-bottom: 20px;
            display: block;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .entry-title {
            font-size: 2.2em;
            color: #8b4513;
            margin-bottom: 15px;
        }

        .entry-message {
            font-size: 1.3em;
            color: #5d3a1a;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        .start-btn {
            padding: 20px 50px;
            font-size: 1.2em;
            background: linear-gradient(135deg, #8b4513, #a0522d);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(139, 69, 19, 0.3);
        }

        .start-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(139, 69, 19, 0.4);
        }

        /* Screen: Question */
        .question-screen {
            background: white;
            border-radius: 25px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .screen-label {
            font-size: 0.95em;
            color: #999;
            text-align: center;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .question-title {
            font-size: 1.1em;
            text-align: center;
            color: #5d3a1a;
            margin-bottom: 30px;
        }

        .statement-card {
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.15), rgba(255, 215, 0, 0.05));
            border: 3px solid #ffd700;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            text-align: center;
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .statement-text {
            font-size: 1.6em;
            color: #3d2817;
            font-weight: bold;
            line-height: 1.5;
        }

        .choice-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 30px;
        }

        .choice-btn {
            padding: 30px 20px;
            font-size: 1.2em;
            border: 3px solid #8b4513;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
            background: white;
            color: #3d2817;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .choice-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(139, 69, 19, 0.2);
            border-color: #a0522d;
        }

        .choice-btn.yes {
            border-color: #4caf50;
            background: rgba(76, 175, 80, 0.05);
        }

        .choice-btn.yes:hover {
            border-color: #45a049;
            background: rgba(76, 175, 80, 0.1);
        }

        .choice-btn.no {
            border-color: #ff9800;
            background: rgba(255, 152, 0, 0.05);
        }

        .choice-btn.no:hover {
            border-color: #f57c00;
            background: rgba(255, 152, 0, 0.1);
        }

        .choice-emoji {
            font-size: 1.8em;
        }

        .choice-text {
            font-size: 1.1em;
        }

        /* Screen: Clue */
        .clue-screen {
            background: white;
            border-radius: 25px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .clue-title {
            font-size: 1.5em;
            text-align: center;
            color: #8b4513;
            margin-bottom: 30px;
            font-weight: bold;
        }

        .clues-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .clue-card {
            background: rgba(255, 215, 0, 0.1);
            border: 2px solid #ffd700;
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            animation: popIn 0.5s ease-out;
        }

        .clue-card:nth-child(2) {
            animation-delay: 0.2s;
        }

        @keyframes popIn {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .clue-emoji {
            font-size: 4em;
            margin-bottom: 15px;
            display: block;
        }

        .clue-text {
            font-size: 1em;
            color: #3d2817;
            line-height: 1.6;
        }

        .continue-btn {
            display: block;
            padding: 20px 50px;
            font-size: 1.1em;
            background: linear-gradient(135deg, #8b4513, #a0522d);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
            margin: 0 auto;
            width: fit-content;
        }

        .continue-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(139, 69, 19, 0.3);
        }

        /* Screen: Result */
        .result-screen {
            background: white;
            border-radius: 25px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .result-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .result-verdict {
            font-size: 2.5em;
            margin-bottom: 15px;
            animation: slideDown 0.5s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-text {
            font-size: 1.2em;
            color: #3d2817;
            line-height: 1.8;
            margin-bottom: 25px;
        }

        .fact-box {
            background: rgba(255, 215, 0, 0.1);
            border-left: 4px solid #ffd700;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 25px;
            text-align: left;
        }

        .fact-box strong {
            color: #8b4513;
            font-size: 1.1em;
        }

        .fact-box p {
            font-size: 1em;
            color: #3d2817;
            line-height: 1.6;
            margin-top: 10px;
        }

        .hint-box {
            background: rgba(76, 175, 80, 0.1);
            border-left: 4px solid #4caf50;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 25px;
            text-align: left;
        }

        .hint-box strong {
            color: #2e7d32;
        }

        .hint-box p {
            font-size: 0.95em;
            color: #3d2817;
            line-height: 1.5;
            margin-top: 5px;
        }

        .source-info {
            font-size: 0.9em;
            color: #999;
            text-align: center;
            padding-top: 20px;
            border-top: 1px solid #eee;
            margin-top: 25px;
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .next-btn {
            padding: 15px 35px;
            font-size: 1.1em;
            background: linear-gradient(135deg, #8b4513, #a0522d);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }

        .next-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(139, 69, 19, 0.3);
        }

        @media (max-width: 768px) {
            .container {
                max-width: 100%;
            }

            h1 {
                font-size: 1.8em;
            }

            .entry-screen {
                padding: 30px 20px;
            }

            .research-icon {
                font-size: 4em;
            }

            .entry-title {
                font-size: 1.6em;
            }

            .entry-message {
                font-size: 1.1em;
            }

            .start-btn {
                padding: 15px 40px;
                font-size: 1em;
            }

            .choice-buttons {
                grid-template-columns: 1fr;
            }

            .choice-btn {
                padding: 25px 15px;
                font-size: 1.1em;
                min-height: 100px;
            }

            .clues-grid {
                grid-template-columns: 1fr;
            }

            .question-screen,
            .clue-screen,
            .result-screen {
                padding: 25px 20px;
            }

            .statement-text {
                font-size: 1.3em;
            }

            .result-verdict {
                font-size: 2em;
            }

            .result-text {
                font-size: 1em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <button class="back-btn" onclick="goBack()">← 돌아가기</button>
            <h1>🔎 추석 팩트 탐정</h1>
            <p class="subtitle">이 말, 정말 맞을까요?</p>
        </div>

        <!-- Entry Screen -->
        <div id="entryScreen" class="screen active entry-screen">
            <span class="research-icon">🔎</span>
            <div class="entry-title">추석 연구소에 오신 것을 환영합니다!</div>
            <p class="entry-message">
                한가위에 대한 이야기를 조사해 볼까요?<br>
                <br>
                정말 맞는 말인지 단서를 찾아 확인해 보세요!
            </p>
            <button class="start-btn" onclick="startInvestigation()">🔎 조사 시작</button>
        </div>

        <!-- Question Screen -->
        <div id="questionScreen" class="screen question-screen">
            <div class="screen-label">🔎 추석 팩트 탐정</div>
            <p class="question-title">이 말, 정말 맞을까요?</p>
            <div class="statement-card">
                <div class="statement-text" id="statementText"></div>
            </div>
            <div class="choice-buttons">
                <button class="choice-btn yes" onclick="selectAnswer(true)">
                    <span class="choice-emoji">✅</span>
                    <span class="choice-text">맞아요</span>
                </button>
                <button class="choice-btn no" onclick="selectAnswer(false)">
                    <span class="choice-emoji">🤔</span>
                    <span class="choice-text">아닌 것 같아요</span>
                </button>
            </div>
        </div>

        <!-- Clue Screen -->
        <div id="clueScreen" class="screen clue-screen">
            <div class="screen-label">🔎 탐정의 단서</div>
            <h2 class="clue-title">단서를 확인해 봐요!</h2>
            <div class="clues-grid" id="cluesGrid"></div>
            <button class="continue-btn" onclick="showResult()">계속 보기 →</button>
        </div>

        <!-- Result Screen -->
        <div id="resultScreen" class="screen result-screen">
            <div class="result-header">
                <div class="result-verdict" id="resultVerdict"></div>
            </div>
            <div class="result-text" id="resultText"></div>
            <div class="fact-box" id="factBox"></div>
            <div class="hint-box" id="hintBox"></div>
            <div class="source-info" id="sourceInfo"></div>
            <div class="action-buttons">
                <button class="next-btn" onclick="returnToVillage()">🏘️ 마을로 돌아가기</button>
            </div>
        </div>
    </div>

    <script src="fact-questions.js"></script>
    <script>
        let currentStep = 'entry'; // entry, question, clue, result
        let selectedAnswer = null;
        let currentQuestionIndex = 0;

        function getCurrentQuestion() {
            return FACT_QUESTIONS[currentQuestionIndex];
        }

        function showScreen(screenName) {
            const screens = document.querySelectorAll('.screen');
            screens.forEach(screen => screen.classList.remove('active'));
            const screen = document.getElementById(screenName + 'Screen');
            if (screen) {
                screen.classList.add('active');
            }
            currentStep = screenName;
        }

        function startInvestigation() {
            const question = getCurrentQuestion();
            document.getElementById('statementText').textContent = question.statement;
            showScreen('question');
        }

        function selectAnswer(answer) {
            selectedAnswer = answer;
            const question = getCurrentQuestion();

            // 선택 피드백 (교육적 목적)
            let feedbackText = '';
            if (answer) {
                feedbackText = "정말 그럴까요? 단서를 확인해 볼까요?";
            } else {
                feedbackText = "좋아요! 단서를 확인해 봐요!";
            }

            // 단서 화면 구성
            const cluesGrid = document.getElementById('cluesGrid');
            cluesGrid.innerHTML = '';
            question.clues.forEach((clue, index) => {
                const clueCard = document.createElement('div');
                clueCard.className = 'clue-card';
                const emoji = question.images ? (index === 0 ? question.images.clue1 : question.images.clue2) : '📖';
                clueCard.innerHTML = `
                    <span class="clue-emoji">${emoji}</span>
                    <div class="clue-text">${clue}</div>
                `;
                cluesGrid.appendChild(clueCard);
            });

            showScreen('clue');
        }

        function showResult() {
            const question = getCurrentQuestion();
            const verdict = question.answer ? '맞아요!' : '❌ 아니에요!';
            const verdictEmoji = question.answer ? '✅' : '❌';

            document.getElementById('resultVerdict').textContent = `${verdictEmoji} ${verdict}`;

            // 결과 설명
            const resultText = question.explanation.join('<br>');
            document.getElementById('resultText').innerHTML = resultText;

            // 팩트 박스
            const factHtml = `<strong>📚 알아보기:</strong><p>${question.explanation[0]}<br><br>${question.explanation[1]}</p>`;
            document.getElementById('factBox').innerHTML = factHtml;

            // 힌트 박스
            const hintHtml = `<strong>💡 탐구 포인트:</strong><p>${question.hint}</p>`;
            document.getElementById('hintBox').innerHTML = hintHtml;

            // 출처 정보
            document.getElementById('sourceInfo').innerHTML = `📖 확인한 자료: ${question.source}`;

            showScreen('result');
        }

        function goBack() {
            window.location.href = '../';
        }

        function returnToVillage() {
            window.location.href = '../';
        }

        // 초기화
        document.addEventListener('DOMContentLoaded', function() {
            // 초기 화면은 entry로 유지
        });
    </script>
</body>
</html>
