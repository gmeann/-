<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>추석 팩트 탐정 - 한가위 어드벤처</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(180deg, #f5e6d3 0%, #e8d4b8 50%, #dfc39e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #3d2817;
        }

        .container {
            max-width: 900px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .back-btn {
            display: inline-block;
            padding: 10px 20px;
            background: rgba(139, 69, 19, 0.2);
            color: #3d2817;
            text-decoration: none;
            border-radius: 50px;
            margin-bottom: 20px;
            font-size: 0.95em;
            transition: all 0.3s;
            border: none;
            cursor: pointer;
        }

        .back-btn:hover {
            background: rgba(139, 69, 19, 0.3);
            transform: translateX(-5px);
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            color: #8b4513;
        }

        .subtitle {
            font-size: 1.2em;
            color: #5d3a1a;
            margin-bottom: 5px;
        }

        .tagline {
            font-size: 1.1em;
            color: #7a4a2a;
        }

        /* Progress Bar */
        .progress-bar {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 15px;
        }

        .progress-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(255, 215, 0, 0.3);
            border: 2px solid #ffd700;
        }

        .progress-dot.completed {
            background: #ffd700;
        }

        .progress-text {
            font-size: 0.9em;
            color: #5d3a1a;
            text-align: center;
            margin-top: 10px;
        }

        /* Screen: Entry */
        .screen {
            display: none;
            animation: fadeIn 0.5s ease-out;
        }

        .screen.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .entry-screen {
            text-align: center;
            background: white;
            border-radius: 25px;
            padding: 50px 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .research-icon {
            font-size: 6em;
            margin-bottom: 20px;
            display: block;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .entry-title {
            font-size: 2.2em;
            color: #8b4513;
            margin-bottom: 15px;
        }

        .entry-message {
            font-size: 1.3em;
            color: #5d3a1a;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        .start-btn {
            padding: 20px 50px;
            font-size: 1.2em;
            background: linear-gradient(135deg, #8b4513, #a0522d);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(139, 69, 19, 0.3);
        }

        .start-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(139, 69, 19, 0.4);
        }

        /* Screen: Question */
        .question-screen {
            background: white;
            border-radius: 25px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .screen-label {
            font-size: 0.95em;
            color: #999;
            text-align: center;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .question-title {
            font-size: 1.1em;
            text-align: center;
            color: #5d3a1a;
            margin-bottom: 30px;
        }

        .statement-card {
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.15), rgba(255, 215, 0, 0.05));
            border: 3px solid #ffd700;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            text-align: center;
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .statement-text {
            font-size: 1.6em;
            color: #3d2817;
            font-weight: bold;
            line-height: 1.5;
        }

        .choice-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 30px;
        }

        .choice-btn {
            padding: 30px 20px;
            font-size: 1.2em;
            border: 3px solid #8b4513;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
            background: white;
            color: #3d2817;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .choice-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(139, 69, 19, 0.2);
            border-color: #a0522d;
        }

        .choice-btn.yes {
            border-color: #4caf50;
            background: rgba(76, 175, 80, 0.05);
        }

        .choice-btn.yes:hover {
            border-color: #45a049;
            background: rgba(76, 175, 80, 0.1);
        }

        .choice-btn.no {
            border-color: #ff9800;
            background: rgba(255, 152, 0, 0.05);
        }

        .choice-btn.no:hover {
            border-color: #f57c00;
            background: rgba(255, 152, 0, 0.1);
        }

        .choice-emoji {
            font-size: 1.8em;
        }

        .choice-text {
            font-size: 1.1em;
        }

        /* Screen: Clue */
        .clue-screen {
            background: white;
            border-radius: 25px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .clue-title {
            font-size: 1.5em;
            text-align: center;
            color: #8b4513;
            margin-bottom: 30px;
            font-weight: bold;
        }

        .clues-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .clue-card {
            background: rgba(255, 215, 0, 0.1);
            border: 2px solid #ffd700;
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            animation: popIn 0.5s ease-out;
        }

        .clue-card:nth-child(2) {
            animation-delay: 0.2s;
        }

        @keyframes popIn {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .clue-emoji {
            font-size: 4em;
            margin-bottom: 15px;
            display: block;
        }

        .clue-text {
            font-size: 1em;
            color: #3d2817;
            line-height: 1.6;
        }

        .continue-btn {
            display: block;
            padding: 20px 50px;
            font-size: 1.1em;
            background: linear-gradient(135deg, #8b4513, #a0522d);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
            margin: 0 auto;
            width: fit-content;
        }

        .continue-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(139, 69, 19, 0.3);
        }

        /* Screen: Clue Exploration */
        .clue-exploration-screen {
            background: white;
            border-radius: 25px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .clue-exploration-instruction {
            font-size: 1.1em;
            color: #5d3a1a;
            text-align: center;
            margin-bottom: 30px;
            padding: 15px;
            background: rgba(255, 215, 0, 0.1);
            border-radius: 10px;
        }

        .exploration-cards {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .exploration-card {
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.1), rgba(255, 215, 0, 0.05));
            border: 2px solid #ffd700;
            border-radius: 15px;
            padding: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .exploration-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(255, 215, 0, 0.3);
            border-color: #ffa500;
        }

        .exploration-card.viewed {
            background: linear-gradient(135deg, rgba(76, 175, 80, 0.1), rgba(76, 175, 80, 0.05));
            border-color: #4caf50;
        }

        .card-icon {
            font-size: 3em;
            margin-bottom: 15px;
            display: block;
        }

        .card-title {
            font-size: 1.2em;
            font-weight: bold;
            color: #8b4513;
            margin-bottom: 15px;
        }

        .card-preview {
            font-size: 1em;
            color: #5d3a1a;
            line-height: 1.5;
        }

        .card-detail {
            font-size: 1em;
            color: #3d2817;
            line-height: 1.6;
            display: none;
        }

        .exploration-card.expanded .card-preview {
            display: none;
        }

        .exploration-card.expanded .card-detail {
            display: block;
        }

        .card-shine {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 1.5em;
            opacity: 0;
            animation: shimmer 0.6s ease-out forwards;
        }

        @keyframes shimmer {
            0% {
                opacity: 1;
                transform: scale(1) rotate(0);
            }
            100% {
                opacity: 0;
                transform: scale(1.5) rotate(20deg);
            }
        }

        .exploration-progress {
            text-align: center;
            margin-bottom: 20px;
            font-size: 1.05em;
            color: #5d3a1a;
        }

        .progress-dots {
            display: inline-flex;
            gap: 8px;
            margin-left: 10px;
        }

        .progress-dot-exploration {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ddd;
            border: 1px solid #999;
        }

        .progress-dot-exploration.checked {
            background: #4caf50;
            border-color: #2e7d32;
        }

        .exploration-confirm-message {
            text-align: center;
            font-size: 1.1em;
            color: #4caf50;
            margin-bottom: 20px;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .exploration-confirm-message.show {
            opacity: 1;
        }

        .fact-confirm-btn {
            display: block;
            padding: 20px 50px;
            font-size: 1.1em;
            background: linear-gradient(135deg, #8b4513, #a0522d);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
            margin: 0 auto;
            width: fit-content;
        }

        .fact-confirm-btn:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(139, 69, 19, 0.3);
        }

        .fact-confirm-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Screen: Result */
        .result-screen {
            background: white;
            border-radius: 25px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .result-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .result-verdict {
            font-size: 2.5em;
            margin-bottom: 15px;
            animation: slideDown 0.5s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-text {
            font-size: 1.2em;
            color: #3d2817;
            line-height: 1.8;
            margin-bottom: 25px;
        }

        .fact-box {
            background: rgba(255, 215, 0, 0.1);
            border-left: 4px solid #ffd700;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 25px;
            text-align: left;
        }

        .fact-box strong {
            color: #8b4513;
            font-size: 1.1em;
        }

        .fact-box p {
            font-size: 1em;
            color: #3d2817;
            line-height: 1.6;
            margin-top: 10px;
        }

        .hint-box {
            background: rgba(76, 175, 80, 0.1);
            border-left: 4px solid #4caf50;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 25px;
            text-align: left;
        }

        .hint-box strong {
            color: #2e7d32;
        }

        .hint-box p {
            font-size: 0.95em;
            color: #3d2817;
            line-height: 1.5;
            margin-top: 5px;
        }

        .source-info {
            font-size: 0.9em;
            color: #999;
            text-align: center;
            padding-top: 20px;
            border-top: 1px solid #eee;
            margin-top: 25px;
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .next-btn {
            padding: 15px 35px;
            font-size: 1.1em;
            background: linear-gradient(135deg, #8b4513, #a0522d);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }

        .next-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(139, 69, 19, 0.3);
        }

        /* Screen: Completion */
        .completion-screen {
            text-align: center;
            background: white;
            border-radius: 25px;
            padding: 50px 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .completion-icon {
            font-size: 5em;
            margin-bottom: 20px;
            display: block;
            animation: celebrate 0.5s ease-out;
        }

        @keyframes celebrate {
            0% {
                transform: scale(0);
                opacity: 0;
            }
            50% {
                transform: scale(1.2);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .completion-title {
            font-size: 2.2em;
            color: #8b4513;
            margin-bottom: 15px;
        }

        .completion-message {
            font-size: 1.3em;
            color: #5d3a1a;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        .fact-count {
            font-size: 1.2em;
            color: #3d2817;
            background: rgba(255, 215, 0, 0.1);
            border: 2px solid #ffd700;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .fact-count strong {
            color: #8b4513;
            font-size: 1.4em;
        }

        @media (max-width: 768px) {
            .container {
                max-width: 100%;
            }

            h1 {
                font-size: 1.8em;
            }

            .entry-screen {
                padding: 30px 20px;
            }

            .research-icon {
                font-size: 4em;
            }

            .entry-title {
                font-size: 1.6em;
            }

            .entry-message {
                font-size: 1.1em;
            }

            .start-btn {
                padding: 15px 40px;
                font-size: 1em;
            }

            .choice-buttons {
                grid-template-columns: 1fr;
            }

            .choice-btn {
                padding: 25px 15px;
                font-size: 1.1em;
                min-height: 100px;
            }

            .clues-grid {
                grid-template-columns: 1fr;
            }

            .exploration-cards {
                grid-template-columns: 1fr;
            }

            .question-screen,
            .clue-screen,
            .clue-exploration-screen,
            .result-screen,
            .completion-screen {
                padding: 25px 20px;
            }

            .statement-text {
                font-size: 1.3em;
            }

            .result-verdict {
                font-size: 2em;
            }

            .result-text {
                font-size: 1em;
            }

            .completion-title {
                font-size: 1.8em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <button class="back-btn" onclick="goBack()">← 돌아가기</button>
            <h1>🔎 추석 팩트 탐정</h1>
            <p class="subtitle">이 말, 정말 맞을까요?</p>
            <div class="progress-bar" id="progressBar"></div>
            <p class="progress-text" id="progressText"></p>
        </div>

        <!-- Entry Screen -->
        <div id="entryScreen" class="screen active entry-screen">
            <span class="research-icon">🔎</span>
            <div class="entry-title">추석 연구소에 오신 것을 환영합니다!</div>
            <p class="entry-message">
                한가위에 대한 이야기를 조사해 볼까요?<br>
                <br>
                정말 맞는 말인지 단서를 찾아 확인해 보세요!
            </p>
            <button class="start-btn" onclick="startInvestigation()">🔎 조사 시작</button>
        </div>

        <!-- Question Screen -->
        <div id="questionScreen" class="screen question-screen">
            <div class="screen-label">🔎 추석 팩트 탐정</div>
            <p class="question-title">이 말, 정말 맞을까요?</p>
            <div class="statement-card">
                <div class="statement-text" id="statementText"></div>
            </div>
            <div class="choice-buttons">
                <button class="choice-btn yes" onclick="selectAnswer(true)">
                    <span class="choice-emoji">✅</span>
                    <span class="choice-text">맞아요</span>
                </button>
                <button class="choice-btn no" onclick="selectAnswer(false)">
                    <span class="choice-emoji">🤔</span>
                    <span class="choice-text">아닌 것 같아요</span>
                </button>
            </div>
        </div>

        <!-- Clue Exploration Screen (for problem 1) -->
        <div id="clueExplorationScreen" class="screen clue-exploration-screen">
            <div class="screen-label">🔎 탐정의 단서</div>
            <h2 class="clue-title">단서를 확인해 봐요!</h2>
            <p class="clue-exploration-instruction">자료를 눌러서 살펴보세요.</p>
            <div class="exploration-progress">
                🔎 단서 확인
                <span class="progress-dots" id="explorationProgressDots"></span>
            </div>
            <div class="exploration-cards" id="explorationCards"></div>
            <div class="exploration-confirm-message" id="confirmMessage">✨ 모든 단서를 확인했어요!</div>
            <button class="fact-confirm-btn" id="factConfirmBtn" onclick="proceedToResult()" disabled>🔎 사실 확인하기</button>
        </div>

        <!-- Clue Screen -->
        <div id="clueScreen" class="screen clue-screen">
            <div class="screen-label">🔎 탐정의 단서</div>
            <h2 class="clue-title">단서를 확인해 봐요!</h2>
            <div class="clues-grid" id="cluesGrid"></div>
            <button class="continue-btn" onclick="showResult()">계속 보기 →</button>
        </div>

        <!-- Result Screen -->
        <div id="resultScreen" class="screen result-screen">
            <div class="result-header">
                <div class="result-verdict" id="resultVerdict"></div>
            </div>
            <div class="result-text" id="resultText"></div>
            <div class="fact-box" id="factBox"></div>
            <div class="hint-box" id="hintBox"></div>
            <div class="source-info" id="sourceInfo"></div>
            <div class="action-buttons">
                <button class="next-btn" id="actionBtn" onclick="handleNextAction()">🔎 다음 문제</button>
            </div>
        </div>

        <!-- Completion Screen -->
        <div id="completionScreen" class="screen completion-screen">
            <span class="completion-icon">🎉</span>
            <div class="completion-title">추석 팩트 탐정 완료!</div>
            <p class="completion-message">
                추석에 대한 이야기를 잘 살펴보았어요.<br>
                <br>
                다양한 관점에서 전통을 이해하는 시간이 되었길 바라요!
            </p>
            <div class="fact-count">
                🔎 확인한 팩트: <strong>5개</strong>
            </div>
            <button class="next-btn" onclick="returnToVillage()">🏘️ 마을로 돌아가기</button>
        </div>
    </div>

    <script src="fact-questions.js"></script>
    <script>
        let currentStep = 'entry'; // entry, question, clue, clueExploration, result, completion
        let selectedAnswer = null;
        let currentQuestionIndex = 0;
        let explorationViewedClues = new Set();

        function getCurrentQuestion() {
            return FACT_QUESTIONS[currentQuestionIndex];
        }

        function updateProgress() {
            const progressBar = document.getElementById('progressBar');
            const progressText = document.getElementById('progressText');

            progressBar.innerHTML = '';
            for (let i = 0; i < FACT_QUESTIONS.length; i++) {
                const dot = document.createElement('div');
                dot.className = 'progress-dot' + (i < currentQuestionIndex ? ' completed' : '');
                progressBar.appendChild(dot);
            }

            progressText.textContent = `🔎 ${currentQuestionIndex + 1} / ${FACT_QUESTIONS.length}`;
        }

        function showScreen(screenName) {
            const screens = document.querySelectorAll('.screen');
            screens.forEach(screen => screen.classList.remove('active'));
            const screen = document.getElementById(screenName + 'Screen');
            if (screen) {
                screen.classList.add('active');
            }
            currentStep = screenName;
            updateProgress();
        }

        function startInvestigation() {
            currentQuestionIndex = 0;
            selectedAnswer = null;
            explorationViewedClues.clear();
            const question = getCurrentQuestion();
            document.getElementById('statementText').textContent = question.statement;
            showScreen('question');
        }

        function selectAnswer(answer) {
            selectedAnswer = answer;
            const question = getCurrentQuestion();

            // 문제 1에서는 단서 탐색 화면으로, 나머지는 기존 단서 화면으로
            if (question.clueExploration && question.clueExploration.length > 0) {
                initializeClueExploration();
                showScreen('clueExploration');
            } else {
                // 단서 화면 구성 (문제 2-5)
                const cluesGrid = document.getElementById('cluesGrid');
                cluesGrid.innerHTML = '';
                question.clues.forEach((clue, index) => {
                    const clueCard = document.createElement('div');
                    clueCard.className = 'clue-card';
                    const emoji = question.images ? (index === 0 ? question.images.clue1 : question.images.clue2) : '📖';
                    clueCard.innerHTML = `
                        <span class="clue-emoji">${emoji}</span>
                        <div class="clue-text">${clue}</div>
                    `;
                    cluesGrid.appendChild(clueCard);
                });

                showScreen('clue');
            }
        }

        function initializeClueExploration() {
            const question = getCurrentQuestion();
            explorationViewedClues.clear();

            const explorationCards = document.getElementById('explorationCards');
            explorationCards.innerHTML = '';

            question.clueExploration.forEach((clueData, index) => {
                const card = document.createElement('div');
                card.className = 'exploration-card';
                card.id = `exploration-card-${index}`;
                card.setAttribute('role', 'button');
                card.setAttribute('tabindex', '0');
                card.onclick = () => handleClueCardClick(index);
                card.onkeypress = (e) => {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        handleClueCardClick(index);
                    }
                };

                card.innerHTML = `
                    <span class="card-icon">${clueData.icon}</span>
                    <div class="card-title">${clueData.title}</div>
                    <div class="card-preview">${clueData.preview}</div>
                    <div class="card-detail">${clueData.detail}</div>
                `;
                explorationCards.appendChild(card);
            });

            updateExplorationProgress();
        }

        function handleClueCardClick(cardIndex) {
            const card = document.getElementById(`exploration-card-${cardIndex}`);
            const isExpanded = card.classList.contains('expanded');

            if (!isExpanded) {
                card.classList.add('expanded');
                card.classList.add('viewed');

                // 반짝임 효과
                const shine = document.createElement('span');
                shine.className = 'card-shine';
                shine.textContent = '✨';
                card.appendChild(shine);
                setTimeout(() => shine.remove(), 600);

                explorationViewedClues.add(cardIndex);
                updateExplorationProgress();
            }
        }

        function updateExplorationProgress() {
            const question = getCurrentQuestion();
            const totalClues = question.clueExploration.length;
            const viewedCount = explorationViewedClues.size;

            // 진행 표시 업데이트
            const progressDots = document.getElementById('explorationProgressDots');
            progressDots.innerHTML = '';
            for (let i = 0; i < totalClues; i++) {
                const dot = document.createElement('span');
                dot.className = 'progress-dot-exploration' + (explorationViewedClues.has(i) ? ' checked' : '');
                progressDots.appendChild(dot);
            }

            // 확인 메시지 표시
            const confirmMessage = document.getElementById('confirmMessage');
            const factConfirmBtn = document.getElementById('factConfirmBtn');

            if (viewedCount === totalClues) {
                confirmMessage.classList.add('show');
                factConfirmBtn.disabled = false;
            } else {
                confirmMessage.classList.remove('show');
                factConfirmBtn.disabled = true;
            }
        }

        function proceedToResult() {
            showResult();
        }

        function showResult() {
            const question = getCurrentQuestion();

            // 판정 표시 (정답의 판정을 항상 표시)
            const verdict = question.answer ? '✅ 맞아요!' : '❌ 아니에요!';
            document.getElementById('resultVerdict').textContent = verdict;

            // 결과 설명
            const resultText = question.explanation.join('<br>');
            document.getElementById('resultText').innerHTML = resultText;

            // 팩트 박스
            const factHtml = `<strong>📚 알아보기:</strong><p>${question.explanation[0]}<br><br>${question.explanation[1]}</p>`;
            document.getElementById('factBox').innerHTML = factHtml;

            // 힌트 박스
            const hintHtml = `<strong>💡 탐구 포인트:</strong><p>${question.hint}</p>`;
            document.getElementById('hintBox').innerHTML = hintHtml;

            // 출처 정보
            const sourceEmoji = question.source === '유네스코' ? '🌏' : '📖';
            document.getElementById('sourceInfo').innerHTML = `${sourceEmoji} 확인한 자료: ${question.source}`;

            // 다음 버튼 설정
            const actionBtn = document.getElementById('actionBtn');
            if (currentQuestionIndex < FACT_QUESTIONS.length - 1) {
                actionBtn.textContent = '🔎 다음 문제';
            } else {
                actionBtn.textContent = '🎉 완료!';
            }

            showScreen('result');
        }

        function handleNextAction() {
            if (currentQuestionIndex < FACT_QUESTIONS.length - 1) {
                // 다음 문제로
                currentQuestionIndex++;
                selectedAnswer = null;
                explorationViewedClues.clear();
                const question = getCurrentQuestion();
                document.getElementById('statementText').textContent = question.statement;
                showScreen('question');
            } else {
                // 완료 화면
                showScreen('completion');
            }
        }

        function goBack() {
            window.location.href = '../';
        }

        function returnToVillage() {
            window.location.href = '../';
        }

        // 초기화
        document.addEventListener('DOMContentLoaded', function() {
            updateProgress();
        });
    </script>
</body>
</html>
