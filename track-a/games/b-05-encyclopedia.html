<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>한가위 도감 - 한가위 어드벤처</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(180deg, #f5e6d3 0%, #e8d4b8 50%, #dfc39e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #3d2817;
        }

        .container {
            max-width: 1000px;
            width: 100%;
        }

        .back-btn {
            display: inline-block;
            padding: 10px 20px;
            background: rgba(61, 40, 23, 0.2);
            color: #3d2817;
            border: none;
            border-radius: 50px;
            margin-bottom: 20px;
            font-size: 0.95em;
            cursor: pointer;
            transition: all 0.3s;
        }

        .back-btn:hover {
            background: rgba(61, 40, 23, 0.3);
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 15px;
            color: #8b4513;
        }

        .subtitle {
            font-size: 1.1em;
            color: #7a4a2a;
            margin-bottom: 20px;
        }

        .stats-box {
            background: rgba(255, 215, 0, 0.2);
            border: 2px solid rgba(255, 215, 0, 0.6);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            margin-bottom: 30px;
        }

        .stats {
            font-size: 1.2em;
            color: #8b4513;
            font-weight: 600;
        }

        .stats span {
            color: #4caf50;
            font-size: 1.4em;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .tab-btn {
            padding: 12px 25px;
            background: white;
            border: 2px solid #d4a574;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            color: #8b4513;
            transition: all 0.3s;
        }

        .tab-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .tab-btn.active {
            background: #8b4513;
            color: white;
            border-color: #654321;
        }

        /* Content Sections */
        .section {
            display: none;
        }

        .section.active {
            display: block;
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Items Grid */
        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .item-card {
            background: white;
            border: 3px solid #d4a574;
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .item-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            border-color: #ffd700;
        }

        .item-card.locked {
            background: rgba(200, 200, 200, 0.3);
            border-color: #999;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .item-card.locked:hover {
            transform: none;
            box-shadow: none;
            border-color: #999;
        }

        .item-emoji {
            font-size: 3em;
        }

        .item-name {
            font-size: 1.2em;
            font-weight: 600;
            color: #8b4513;
        }

        .item-desc {
            font-size: 0.85em;
            color: #666;
            line-height: 1.4;
        }

        .lock-badge {
            font-size: 1.5em;
            color: #999;
        }

        /* Detail Modal */
        .detail-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }

        .detail-modal.show {
            display: flex;
            animation: fadeIn 0.3s ease-out;
        }

        .detail-content {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            max-height: 80vh;
            overflow-y: auto;
        }

        .detail-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .detail-emoji {
            font-size: 4em;
        }

        .close-btn {
            background: #f44336;
            color: white;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            cursor: pointer;
            font-size: 1.5em;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .close-btn:hover {
            background: #d32f2f;
        }

        .detail-title {
            font-size: 1.8em;
            color: #8b4513;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .detail-text {
            font-size: 1em;
            color: #3d2817;
            line-height: 1.8;
            margin-bottom: 20px;
        }

        .unlocked-badge {
            display: inline-block;
            background: #4caf50;
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: 600;
            margin-top: 15px;
        }

        .info-box {
            background: rgba(255, 215, 0, 0.15);
            border-left: 4px solid #ffd700;
            border-radius: 10px;
            padding: 20px;
            margin-top: 30px;
            font-size: 0.95em;
            color: #3d2817;
            line-height: 1.6;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8em;
            }

            .items-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .detail-content {
                padding: 25px;
            }

            .tabs {
                gap: 5px;
            }

            .tab-btn {
                padding: 10px 15px;
                font-size: 0.9em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <button class="back-btn" onclick="goBack()">← 돌아가기</button>
            <h1>📚 한가위 도감</h1>
            <p class="subtitle">추석의 문화를 모아 보아요</p>

            <div class="stats-box">
                <div class="stats">수집한 항목: <span id="collectionCount">0</span> / <span id="totalCount">0</span></div>
            </div>
        </div>

        <!-- Tabs -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('foods')">🍡 음식</button>
            <button class="tab-btn" onclick="switchTab('games')">🎲 놀이</button>
            <button class="tab-btn" onclick="switchTab('traditions')">🌾 풍습</button>
            <button class="tab-btn" onclick="switchTab('history')">📖 역사</button>
        </div>

        <!-- Foods Section -->
        <div class="section active" id="foods">
            <div class="items-grid" id="foodsGrid"></div>
        </div>

        <!-- Games Section -->
        <div class="section" id="games">
            <div class="items-grid" id="gamesGrid"></div>
        </div>

        <!-- Traditions Section -->
        <div class="section" id="traditions">
            <div class="items-grid" id="traditionsGrid"></div>
        </div>

        <!-- History Section -->
        <div class="section" id="history">
            <div class="items-grid" id="historyGrid"></div>
        </div>

        <div class="info-box">
            💡 팁: 게임을 완료하면 도감의 항목들이 자동으로 잠금이 해제돼요. 모든 항목을 수집해 보세요!
        </div>
    </div>

    <!-- Detail Modal -->
    <div class="detail-modal" id="detailModal">
        <div class="detail-content">
            <div class="detail-header">
                <div class="detail-emoji" id="detailEmoji"></div>
                <button class="close-btn" onclick="closeDetail()">×</button>
            </div>
            <div class="detail-title" id="detailTitle"></div>
            <div class="detail-text" id="detailText"></div>
            <div id="unlockedInfo"></div>
        </div>
    </div>

    <script>
        const encyclopediaData = {
            foods: [
                {
                    name: '송편',
                    emoji: '🍡',
                    desc: '찹쌀로 만든\n전통 음식',
                    detail: '송편은 찹쌀가루로 만든 반죽에 깨, 팥, 밤 등의 소를 넣고 반달 모양으로 빚어서, 솔잎을 깔고 찐 전통 음식입니다. 추석에 함께 만들며 가족의 화목을 도모해요.',
                    game: 'songpyeon'
                },
                {
                    name: '소주',
                    emoji: '🍶',
                    desc: '추석의\n전통 술',
                    detail: '추석에는 새로 지은 쌀로 만든 술을 조상께 올렸어요. 이를 신주라고 하며, 가족과 함께 나누며 새 harvest를 축하했습니다.',
                    game: 'harvest'
                },
                {
                    name: '탕국',
                    emoji: '🍲',
                    desc: '소를 넣은\n국물 음식',
                    detail: '추석 차례에 올리는 탕국은 고기를 넣어 우린 국입니다. 대대손손 이어지는 가족의 번영을 기원하는 의미를 담고 있어요.',
                    game: 'harvest'
                },
                {
                    name: '과일',
                    emoji: '🍎',
                    desc: '그해 첫\n수확 과일',
                    detail: '추석에는 그해에 새로 나온 과일들, 특히 배와 포도, 사과 같은 제철 과일을 차례상에 올립니다. 새로운 계절의 풍요로움을 나누는 의미가 있어요.',
                    game: 'harvest'
                },
                {
                    name: '밤',
                    emoji: '🌰',
                    desc: '가을의\n대표 음식',
                    detail: '밤은 가을에 수확하는 대표 음식으로, 송편의 소로도 쓰이고 그대로 구워 먹기도 합니다. 추석 차례에 빼놓을 수 없는 음식이에요.',
                    game: 'harvest'
                },
                {
                    name: '대추',
                    emoji: '🔴',
                    desc: '빨간 과일\n가을 선물',
                    detail: '대추는 가을에 수확하는 과일로, 추석 차례상에 올리는 중요한 음식입니다. 달콤한 맛과 붉은 색이 특징이에요.',
                    game: 'harvest'
                }
            ],
            games: [
                {
                    name: '윷놀이',
                    emoji: '🪵',
                    desc: '윷으로\n말을 움직이는 놀이',
                    detail: '윷놀이는 네 개의 막대를 던져 결과에 따라 말을 움직이는 게임입니다. 추석에 가족들이 함께 즐기던 대표적인 전통 놀이예요. 전략과 운이 함께하는 재미있는 게임입니다.',
                    game: 'games'
                },
                {
                    name: '제기차기',
                    emoji: '🪁',
                    desc: '발로 제기를\n계속 차올리기',
                    detail: '제기는 동전이나 종이를 모아 만든 물건으로, 발로 차올려 계속 유지하는 놀이입니다. 혼자 하거나 팀을 나누어 경쟁하곤 했어요.',
                    game: 'games'
                },
                {
                    name: '줄다리기',
                    emoji: '🪢',
                    desc: '단체로 함께\n힘을 겨루는 놀이',
                    detail: '줄다리기는 마을 사람들이 둘로 나뉘어 큰 줄을 잡고 힘을 겨루는 놀이입니다. 마을의 단합을 다지고 풍작을 기원했던 중요한 명절 행사였어요.',
                    game: 'games'
                },
                {
                    name: '강강술래',
                    emoji: '👯',
                    desc: '여자들이 함께\n원을 그리는 놀이',
                    detail: '강강술래는 여자들이 손을 잡고 원을 그리며 민요를 부르면서 도는 전통 놀이입니다. 추석 밤 달빛 아래서 즐기던 우리 민족의 아름다운 문화예요.',
                    game: 'games'
                },
                {
                    name: '길쌈',
                    emoji: '🧵',
                    desc: '여럿이 실을\n꼬아 만드는 놀이',
                    detail: '길쌈은 여러 사람이 함께 실을 돌리면서 끝을 꼬아 한 줄의 긴 실을 만드는 놀이입니다. 신라 시대부터 즐기던 팀 게임으로, 함께 만드는 기쁨을 나누던 놀이예요.',
                    game: 'ancient_festival'
                }
            ],
            traditions: [
                {
                    name: '차례',
                    emoji: '🙏',
                    desc: '조상께 음식을\n바치는 의식',
                    detail: '차례는 추석에 조상을 모시고 음식을 올려 감사하는 의식입니다. 가족이 함께 모여 조상의 정신을 기리고, 우리 가족의 안녕을 기원하는 중요한 전통이에요.',
                    game: 'harvest'
                },
                {
                    name: '성묘',
                    emoji: '🌾',
                    desc: '무덤을 찾아\n조상을 뵙다',
                    detail: '성묘는 추석에 조상의 무덤을 찾아 성을 낸다는 뜻입니다. 가을의 첫 곡식을 바치며 조상을 뵙고, 가족이 함께 도량을 넓히는 전통이에요.',
                    game: 'ancient_festival'
                },
                {
                    name: '보름날 달맞이',
                    emoji: '🌕',
                    desc: '가을 보름달을\n감상하는 풍습',
                    detail: '추석 밤의 보름달은 그 해 가장 둥글고 밝습니다. 가족과 이웃들이 함께 달을 감상하며 풍요한 수확을 축하하고, 새로운 계절을 맞이했어요.',
                    game: 'find_moon'
                },
                {
                    name: '한글 공휴일',
                    emoji: '📅',
                    desc: '추석은 3일간의\n연휴',
                    detail: '추석은 음력 8월 15일을 중심으로 3일간 공휴일입니다. 이 기간 동안 국민 대부분이 귀향하여 가족을 만나고, 고향의 정취를 느끼게 되어요.',
                    game: 'all'
                }
            ],
            history: [
                {
                    name: '가배(가을 추석)',
                    emoji: '📖',
                    desc: '신라 시대의\n추석 이름',
                    detail: '신라 시대에는 추석을 "가배"라고 불렀습니다. 가배는 "가을 인사"라는 뜻으로, 새로운 계절을 맞이하고 조상을 기리는 의식이었어요.',
                    game: 'ancient_festival'
                },
                {
                    name: '한국 문화유산',
                    emoji: '🏛️',
                    desc: '유네스코 인류\n무형문화재',
                    detail: '한국의 추석 문화와 명절 전통은 세계가 인정하는 소중한 문화유산입니다. 강강술래와 같은 전통 놀이도 유네스코에 등록되어 있어요.',
                    game: 'games'
                },
                {
                    name: '수천 년의 전통',
                    emoji: '⏰',
                    desc: '추석은 삼국 시대부터\n이어지는 명절',
                    detail: '추석의 전통은 한반도 역사 속에서 수천 년을 이어져 내려왔습니다. 신라, 고려, 조선을 거치면서 지금의 모습으로 발전했으며, 오늘날에도 계속 이어지고 있어요.',
                    game: 'ancient_festival'
                },
                {
                    name: '국경일',
                    emoji: '🇰🇷',
                    desc: '추석은 국가\n공휴일',
                    detail: '현대에 추석은 대한민국의 중요한 국경일로 지정되었습니다. 이는 한국 문화와 전통을 보존하고, 국민들이 함께 명절의 의미를 나누기 위한 국가적 결정이에요.',
                    game: 'all'
                }
            ]
        };

        let currentDetailItem = null;
        const gameState = {
            songpyeon: false,
            games: false,
            harvest: false,
            find_moon: false,
            ancient_festival: false,
            all: true // Always unlocked
        };

        function initEncyclopedia() {
            loadGameState();
            renderAllSections();
            updateStats();
        }

        function loadGameState() {
            const state = JSON.parse(localStorage.getItem('gameCompletionState') || '{}');
            gameState.songpyeon = state.songpyeon || false;
            gameState.games = state.games || false;
            gameState.harvest = state.harvest || false;
            gameState.find_moon = state.findmoon || false;
            gameState.ancient_festival = state['trackb-game01'] || false;
        }

        function renderAllSections() {
            renderSection('foods');
            renderSection('games');
            renderSection('traditions');
            renderSection('history');
        }

        function renderSection(section) {
            const data = encyclopediaData[section];
            const grid = document.getElementById(section + 'Grid');
            grid.innerHTML = '';

            data.forEach(item => {
                const isUnlocked = gameState[item.game];
                const card = document.createElement('div');
                card.className = `item-card ${isUnlocked ? '' : 'locked'}`;
                card.innerHTML = `
                    <div class="item-emoji">${isUnlocked ? item.emoji : '🔒'}</div>
                    <div class="item-name">${item.name}</div>
                    <div class="item-desc">${isUnlocked ? item.desc : '게임을 완료해 잠금 해제'}</div>
                `;

                if (isUnlocked) {
                    card.onclick = () => showDetail(item);
                }
                grid.appendChild(card);
            });
        }

        function updateStats() {
            let total = 0;
            let collected = 0;

            for (let section in encyclopediaData) {
                encyclopediaData[section].forEach(item => {
                    total++;
                    if (gameState[item.game]) {
                        collected++;
                    }
                });
            }

            document.getElementById('totalCount').textContent = total;
            document.getElementById('collectionCount').textContent = collected;
        }

        function switchTab(tab) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.getElementById(tab).classList.add('active');

            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.currentTarget.classList.add('active');
        }

        function showDetail(item) {
            currentDetailItem = item;
            document.getElementById('detailEmoji').textContent = item.emoji;
            document.getElementById('detailTitle').textContent = item.name;
            document.getElementById('detailText').textContent = item.detail;

            const unlockedInfo = document.getElementById('unlockedInfo');
            unlockedInfo.innerHTML = `<div class="unlocked-badge">✅ 수집완료</div>`;

            document.getElementById('detailModal').classList.add('show');
        }

        function closeDetail() {
            document.getElementById('detailModal').classList.remove('show');
            currentDetailItem = null;
        }

        function goBack() {
            window.history.back();
        }

        // Close modal on outside click
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('detailModal').addEventListener('click', (e) => {
                if (e.target.id === 'detailModal') {
                    closeDetail();
                }
            });

            initEncyclopedia();
        });
    </script>
</body>
</html>
