<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>진짜일까? 가짜일까? - 한가위 어드벤처</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(180deg, #f5e6d3 0%, #e8d4b8 50%, #dfc39e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #3d2817;
        }

        .container {
            max-width: 900px;
            width: 100%;
        }

        .back-btn {
            display: inline-block;
            padding: 10px 20px;
            background: rgba(61, 40, 23, 0.2);
            color: #3d2817;
            border: none;
            border-radius: 50px;
            margin-bottom: 20px;
            font-size: 0.95em;
            cursor: pointer;
            transition: all 0.3s;
        }

        .back-btn:hover {
            background: rgba(61, 40, 23, 0.3);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 15px;
            color: #8b4513;
        }

        /* Game Area */
        .game-area {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 30px;
            padding: 40px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            min-height: 450px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .progress-bar {
            width: 100%;
            max-width: 400px;
            height: 8px;
            background: #ddd;
            border-radius: 10px;
            margin-bottom: 30px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4caf50, #8bc34a);
            transition: width 0.3s ease;
        }

        .question-counter {
            font-size: 1em;
            color: #8b4513;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .statement-box {
            background: rgba(255, 215, 0, 0.1);
            border: 3px solid rgba(255, 215, 0, 0.6);
            border-radius: 20px;
            padding: 30px;
            margin: 30px 0;
            font-size: 1.3em;
            color: #3d2817;
            text-align: center;
            line-height: 1.8;
            font-weight: 500;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .statement-icon {
            font-size: 3em;
            margin-bottom: 15px;
        }

        /* Answer Buttons */
        .answer-buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
            margin: 30px 0;
            width: 100%;
        }

        .answer-btn {
            padding: 20px 40px;
            font-size: 1.2em;
            border: 3px solid #d4a574;
            background: white;
            color: #8b4513;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
            min-width: 150px;
        }

        .answer-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .answer-btn.true-btn:hover {
            border-color: #4caf50;
            background: rgba(76, 175, 80, 0.1);
        }

        .answer-btn.false-btn:hover {
            border-color: #f44336;
            background: rgba(244, 67, 54, 0.1);
        }

        .answer-btn:disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }

        .answer-btn.correct {
            background: #4caf50;
            color: white;
            border-color: #2e7d32;
            animation: pulse 0.5s ease-out;
        }

        .answer-btn.incorrect {
            background: #f44336;
            color: white;
            border-color: #d32f2f;
            animation: shake 0.5s ease-out;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
            100% {
                transform: scale(1);
            }
        }

        @keyframes shake {
            0%, 100% {
                transform: translateX(0);
            }
            25% {
                transform: translateX(-10px);
            }
            75% {
                transform: translateX(10px);
            }
        }

        .feedback-box {
            display: none;
            background: rgba(76, 175, 80, 0.15);
            border: 2px solid #4caf50;
            border-radius: 15px;
            padding: 20px;
            margin-top: 20px;
            text-align: left;
            animation: slideUp 0.5s ease-out;
        }

        .feedback-box.show {
            display: block;
        }

        .feedback-box.wrong {
            background: rgba(244, 67, 54, 0.15);
            border-color: #f44336;
        }

        .feedback-title {
            font-size: 1.1em;
            font-weight: bold;
            color: #3d2817;
            margin-bottom: 10px;
        }

        .feedback-text {
            font-size: 1em;
            color: #3d2817;
            line-height: 1.6;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Result Screen */
        .result-screen {
            display: none;
            text-align: center;
            width: 100%;
        }

        .result-screen.show {
            display: block;
            animation: slideUp 0.5s ease-out;
        }

        .result-title {
            font-size: 2.2em;
            color: #4caf50;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .result-emoji {
            font-size: 5em;
            margin: 20px 0;
        }

        .result-message {
            font-size: 1.1em;
            color: #3d2817;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .fact-box {
            background: rgba(255, 215, 0, 0.15);
            border: 2px solid rgba(255, 215, 0, 0.6);
            border-radius: 15px;
            padding: 20px;
            margin-top: 25px;
            text-align: left;
            font-size: 1em;
            color: #3d2817;
        }

        .fact-box strong {
            display: block;
            margin-bottom: 10px;
            font-size: 1.1em;
        }

        .moon-fragment {
            font-size: 3em;
            animation: float 3s ease-in-out infinite;
            margin-top: 20px;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .score-box {
            background: rgba(76, 175, 80, 0.15);
            border: 2px solid #4caf50;
            border-radius: 15px;
            padding: 20px;
            margin-top: 20px;
            font-size: 1.1em;
            color: #3d2817;
        }

        .score-box strong {
            color: #4caf50;
            font-size: 1.3em;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8em;
            }

            .game-area {
                padding: 25px;
            }

            .answer-btn {
                min-width: 120px;
                padding: 15px 30px;
            }

            .statement-box {
                font-size: 1.1em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <button class="back-btn" onclick="goBack()">← 돌아가기</button>
            <h1>🔍 진짜일까? 가짜일까?</h1>
        </div>

        <!-- Game Area -->
        <div class="game-area">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>

            <div class="question-counter" id="questionCounter">문제 1/6</div>

            <!-- Game Section -->
            <div id="gameSection">
                <div class="statement-box" id="statementBox">
                    <div id="statement"></div>
                </div>

                <div class="answer-buttons">
                    <button class="answer-btn true-btn" id="trueBtn" onclick="answerQuestion(true)">⭕ 진짜예요!</button>
                    <button class="answer-btn false-btn" id="falseBtn" onclick="answerQuestion(false)">❌ 가짜예요!</button>
                </div>

                <div class="feedback-box" id="feedbackBox">
                    <div class="feedback-title" id="feedbackTitle"></div>
                    <div class="feedback-text" id="feedbackText"></div>
                </div>

                <button class="answer-btn" style="background: #4caf50; color: white; border-color: #2e7d32; display: none; margin-top: 20px;" id="nextBtn" onclick="nextQuestion()">다음 문제 →</button>
            </div>

            <!-- Result Section -->
            <div class="result-screen" id="resultScreen">
                <div class="result-title">🎉 모든 문제를 풀었어요!</div>
                <div class="result-emoji">📚</div>
                <div class="result-message" id="resultMessage">
                    추석 전통에 대해 얼마나 잘 알고 있는지 확인했어요!
                </div>
                <div class="score-box" id="scoreBox">
                    정답: <strong id="scoreCount">0</strong> / 6
                </div>
                <div class="fact-box">
                    <strong>🌕 추석 상식 정리</strong>
                    <p>
                        추석은 음력 8월 15일로 하지만(가을 추석)이라고도 불러요.
                        이때 가족과 이웃들이 함께 모여 음식을 나누고 놀이를 즐기며 추수를 감사했답니다.
                        송편, 소주, 탕국 등 다양한 음식을 만들어 먹고, 윷놀이나 강강술래 같은 전통 놀이를 함께 했어요!
                    </p>
                </div>
                <div class="moon-fragment">🌙</div>
                <p style="font-size: 1.1em; color: #8b4513; margin-top: 20px; font-weight: 600;">달 조각을 획득했어요!</p>
                <div class="action-buttons" style="margin-top: 30px;">
                    <button class="answer-btn" style="background: #4caf50; color: white; border-color: #2e7d32;" onclick="goToMenu()">기록실로 돌아가기</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const questions = [
            {
                statement: "추석에는 가족들이 함께 모여 음식을 나누고 놀이를 즐긴다.",
                answer: true,
                explanation: "맞습니다! 추석은 가족 단위로 함께 모여 명절을 보내고, 함께 음식을 만들어 나누며, 윷놀이나 강강술래 같은 전통 놀이를 즐기는 우리 민족의 가장 중요한 명절이에요."
            },
            {
                statement: "송편은 밀가루로 만든다.",
                answer: false,
                explanation: "틀렸습니다! 송편은 찹쌀가루로 반죽을 만들어요. 송편에 깨, 팥, 밤 등의 소를 넣고 반달 모양으로 빚은 후, 솔잎을 깔고 쪄낸답니다."
            },
            {
                statement: "추석은 음력 8월 15일이다.",
                answer: true,
                explanation: "맞습니다! 추석은 음력 8월 15일로 보름날을 기해요. 이날 밤에는 가장 둥근 보름달을 감상할 수 있는 명절이랍니다."
            },
            {
                statement: "윷놀이는 4개의 막대를 던져서 결과를 정한다.",
                answer: true,
                explanation: "맞습니다! 윷은 네 개의 막대를 던져 위아래 방향에 따라 '도', '개', '걸', '윷', '모'의 결과가 나와요. 이 결과에 따라 말의 위치가 결정되지요."
            },
            {
                statement: "강강술래는 남자들만 하는 놀이이다.",
                answer: false,
                explanation: "틀렸습니다! 강강술래는 여자들이 손을 잡고 원을 그리며 노래를 부르면서 함께 도는 전통 놀이예요. 마을의 여자들이 함께 즐기던 아름다운 명절 놀이랍니다."
            },
            {
                statement: "제기차기는 발로 제기를 차올리며 계속 유지하는 놀이이다.",
                answer: true,
                explanation: "맞습니다! 제기차기는 발을 사용하여 제기를 차올려 계속해서 떨어지지 않게 유지하는 놀이예요. 팀을 나누어 경쟁하거나 혼자서 몇 번을 차는지 겨루기도 했답니다."
            }
        ];

        let currentQuestion = 0;
        let correctCount = 0;

        function goBack() {
            window.history.back();
        }

        function goToMenu() {
            localStorage.setItem('gameCompletionState', JSON.stringify({
                'factcheck': true,
                ...(JSON.parse(localStorage.getItem('gameCompletionState') || '{}'))
            }));
            window.location.href = '../index.html';
        }

        function loadQuestion() {
            const question = questions[currentQuestion];
            document.getElementById('statement').textContent = question.statement;
            document.getElementById('questionCounter').textContent = `문제 ${currentQuestion + 1}/${questions.length}`;
            document.getElementById('progressFill').style.width = ((currentQuestion + 1) / questions.length * 100) + '%';

            const feedbackBox = document.getElementById('feedbackBox');
            feedbackBox.classList.remove('show', 'wrong');
            document.getElementById('nextBtn').style.display = 'none';

            const trueBtn = document.getElementById('trueBtn');
            const falseBtn = document.getElementById('falseBtn');
            trueBtn.classList.remove('correct', 'incorrect');
            falseBtn.classList.remove('correct', 'incorrect');
            trueBtn.disabled = false;
            falseBtn.disabled = false;
        }

        function answerQuestion(answer) {
            const question = questions[currentQuestion];
            const isCorrect = answer === question.answer;

            const feedbackBox = document.getElementById('feedbackBox');
            const trueBtn = document.getElementById('trueBtn');
            const falseBtn = document.getElementById('falseBtn');

            if (isCorrect) {
                correctCount++;
                const btn = answer ? trueBtn : falseBtn;
                btn.classList.add('correct');
                feedbackBox.classList.remove('wrong');
                document.getElementById('feedbackTitle').textContent = '✅ 정답입니다!';
            } else {
                const btn = answer ? trueBtn : falseBtn;
                btn.classList.add('incorrect');
                feedbackBox.classList.add('wrong');
                document.getElementById('feedbackTitle').textContent = '❌ 틀렸어요!';
            }

            document.getElementById('feedbackText').textContent = question.explanation;
            feedbackBox.classList.add('show');

            trueBtn.disabled = true;
            falseBtn.disabled = true;

            if (currentQuestion < questions.length - 1) {
                document.getElementById('nextBtn').style.display = 'block';
            } else {
                setTimeout(() => finishGame(), 2000);
            }
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion < questions.length) {
                loadQuestion();
            } else {
                finishGame();
            }
        }

        function finishGame() {
            document.getElementById('gameSection').style.display = 'none';
            document.getElementById('scoreCount').textContent = correctCount;
            document.getElementById('resultScreen').classList.add('show');
        }

        // Initialize
        loadQuestion();
    </script>
</body>
</html>
