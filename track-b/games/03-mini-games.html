<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>한가위 놀이마당 - 한가위 어드벤처</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #2d5016 0%, #4a7c2c 50%, #2d5016 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: white;
        }

        .container {
            max-width: 900px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .back-btn {
            display: inline-block;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: none;
            border-radius: 50px;
            margin-bottom: 20px;
            font-size: 0.95em;
            cursor: pointer;
            transition: all 0.3s;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 15px;
        }

        .subtitle {
            font-size: 1.1em;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 40px;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .game-card {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .game-card:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 215, 0, 0.6);
            transform: scale(1.05);
        }

        .game-card.selected {
            border-color: #5aa956;
            background: rgba(90, 169, 86, 0.3);
            animation: pulse 0.5s ease-out;
        }

        .game-icon {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .game-name {
            font-size: 1em;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .game-label {
            font-size: 0.75em;
            color: rgba(255, 255, 255, 0.6);
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.1);
            }
        }

        .game-content {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 215, 0, 0.3);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            display: none;
            animation: slideUp 0.5s ease-out;
            margin-bottom: 30px;
        }

        .game-content.show {
            display: block;
        }

        /* Yut Game */
        .yut-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 30px 0;
        }

        .yut-stick {
            width: 40px;
            height: 80px;
            background: white;
            border: 2px solid #333;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5em;
            cursor: pointer;
            transition: all 0.3s;
        }

        .yut-stick:hover {
            transform: scale(1.1);
        }

        .yut-stick.flipped {
            background: #333;
            animation: flip 0.6s ease-out;
        }

        @keyframes flip {
            0% {
                transform: rotateX(0deg);
            }
            100% {
                transform: rotateX(360deg);
            }
        }

        .pattern-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin: 20px 0;
        }

        .pattern-box {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1.5em;
        }

        .pattern-box:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
        }

        .pattern-box.selected {
            border-color: #5aa956;
            background: rgba(90, 169, 86, 0.3);
        }

        .kick-game {
            font-size: 3em;
            margin: 30px 0;
        }

        .kick-button {
            padding: 15px 40px;
            background: rgba(255, 215, 0, 0.3);
            color: white;
            border: 2px solid rgba(255, 215, 0, 0.6);
            border-radius: 50px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
            margin-top: 15px;
        }

        .kick-button:hover {
            background: rgba(255, 215, 0, 0.5);
            transform: scale(1.05);
        }

        .result-box {
            background: rgba(76, 175, 80, 0.2);
            border: 2px solid rgba(76, 175, 80, 0.5);
            border-radius: 20px;
            padding: 25px;
            text-align: center;
            display: none;
            animation: slideUp 0.5s ease-out;
        }

        .result-box.show {
            display: block;
        }

        .result-box h2 {
            font-size: 1.8em;
            color: #4caf50;
            margin-bottom: 15px;
        }

        .result-box p {
            font-size: 1em;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .completion-box {
            background: rgba(76, 175, 80, 0.2);
            border: 2px solid rgba(76, 175, 80, 0.5);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            display: none;
            animation: slideUp 0.5s ease-out;
        }

        .completion-box.show {
            display: block;
        }

        .completion-box h2 {
            font-size: 2em;
            color: #4caf50;
            margin-bottom: 15px;
        }

        .next-button {
            padding: 15px 40px;
            background: #5aa956;
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
            margin-top: 20px;
        }

        .next-button:hover {
            background: #4a9744;
            transform: scale(1.02);
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8em;
            }

            .games-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <button class="back-btn" onclick="goBack()">← 돌아가기</button>
            <h1>🎲 한가위 놀이마당</h1>
            <p class="subtitle">추석의 전통 놀이들을 직접 체험해보세요!</p>
        </div>

        <div class="games-grid" id="gamesList"></div>

        <!-- Yut Game -->
        <div class="game-content" id="yutGame">
            <h2>🎳 윷 던지기</h2>
            <p>윷을 던져 나온 모양을 확인하세요!</p>
            <div class="yut-container" id="yutContainer"></div>
            <div id="yutResult" style="font-size: 1.2em; margin-top: 20px;"></div>
            <button class="kick-button" onclick="throwYut()">윷 던지기</button>
        </div>

        <!-- Ganggang Sullae Game -->
        <div class="game-content" id="ganggang">
            <h2>💃 강강술래 패턴</h2>
            <p>나타나는 패턴을 모두 기억해서 찾으세요!</p>
            <div class="pattern-grid" id="patternGrid"></div>
            <div id="patternResult"></div>
        </div>

        <!-- Tug of War Game -->
        <div class="game-content" id="tugging">
            <h2>🧗 줄다리기</h2>
            <p>우리 팀의 힘을 모아 줄다리기를 해요!</p>
            <div style="margin: 30px 0;">
                <div style="font-size: 2.5em;">🧗 🆚 🧗</div>
                <div id="tugResult" style="margin-top: 15px; font-size: 1.2em;"></div>
            </div>
            <button class="kick-button" onclick="playTugOfWar()">줄 당기기</button>
        </div>

        <!-- Jegichagi Game -->
        <div class="game-content" id="jegi">
            <h2>🎯 제기차기</h2>
            <p>제기를 최대한 많이 차 올려보세요!</p>
            <div class="kick-game" id="jegiDisplay">🎯</div>
            <div id="jegiCount" style="font-size: 1.3em;">0번</div>
            <button class="kick-button" onclick="kickJegi()">제기 차기</button>
        </div>

        <div class="result-box" id="resultBox"></div>
        <div class="completion-box" id="completionBox">
            <h2>🎉 모든 놀이를 즐겼어요!</h2>
            <p>추석은 이렇게 다양한 전통 놀이로 가족과 지역 주민들이 함께 즐기는 명절이에요!</p>
            <button class="next-button" onclick="completeGame()">다음 게임으로</button>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'track-b-progress';

        const games = [
            { name: '윷 던지기', emoji: '🎳', id: 'yutGame' },
            { name: '강강술래 패턴', emoji: '💃', id: 'ganggang' },
            { name: '줄다리기', emoji: '🧗', id: 'tugging' },
            { name: '제기차기', emoji: '🎯', id: 'jegi' }
        ];

        let playedGames = new Set();
        let jegiCount = 0;
        let patternMatches = 0;

        function initGame() {
            const gamesList = document.getElementById('gamesList');
            gamesList.innerHTML = '';

            games.forEach((game, index) => {
                const card = document.createElement('div');
                card.className = 'game-card';
                card.innerHTML = `<div class="game-icon">${game.emoji}</div><div class="game-name">${game.name}</div><div class="game-label">클릭하여 플레이</div>`;
                card.onclick = () => startGame(card, game, index);
                gamesList.appendChild(card);
            });

            // Initialize pattern game
            initPatternGame();
        }

        function startGame(element, game, index) {
            element.classList.add('selected');
            playedGames.add(index);

            // Hide all game contents
            document.querySelectorAll('.game-content').forEach(el => el.classList.remove('show'));

            // Show selected game
            setTimeout(() => {
                document.getElementById(game.id).classList.add('show');
            }, 300);

            // Reset game-specific variables
            if (game.id === 'jegi') jegiCount = 0;

            // Check if all games played
            setTimeout(() => {
                if (playedGames.size === games.length) {
                    document.querySelectorAll('.game-content').forEach(el => el.classList.remove('show'));
                    document.getElementById('completionBox').classList.add('show');
                }
            }, 3000);
        }

        // Yut Game
        function throwYut() {
            const container = document.getElementById('yutContainer');
            container.innerHTML = '';

            const yuts = ['🟩', '🟥', '🟩', '🟥', '🟩'];
            const result = Math.random() > 0.5;

            yuts.forEach((yut, index) => {
                const stick = document.createElement('div');
                stick.className = 'yut-stick' + (index % 2 === (result ? 1 : 0) ? ' flipped' : '');
                stick.textContent = index % 2 === (result ? 1 : 0) ? '⭕' : '⚫';
                setTimeout(() => {
                    stick.classList.add('flipped');
                }, index * 100);
                container.appendChild(stick);
            });

            setTimeout(() => {
                const resultText = result ? 'Do' : 'Gae';
                document.getElementById('yutResult').textContent = `결과: ${resultText}!`;
            }, 600);
        }

        // Ganggang Sullae Pattern Game
        function initPatternGame() {
            const patterns = ['🟦', '🟩', '🟨', '🟥'];
            const grid = document.getElementById('patternGrid');
            grid.innerHTML = '';

            patterns.forEach((pattern, index) => {
                const box = document.createElement('div');
                box.className = 'pattern-box';
                box.textContent = pattern;
                box.onclick = () => {
                    box.classList.add('selected');
                    patternMatches++;
                    if (patternMatches === 4) {
                        document.getElementById('patternResult').textContent = '🎉 패턴을 모두 맞혔어요!';
                    }
                };
                grid.appendChild(box);
            });
        }

        // Tug of War
        function playTugOfWar() {
            const result = Math.random() > 0.5;
            const resultEl = document.getElementById('tugResult');
            resultEl.textContent = result ? '🎉 우리가 이겼어요!' : '😄 상대팀이 이겼어요!';
        }

        // Jegi Game
        function kickJegi() {
            jegiCount++;
            document.getElementById('jegiCount').textContent = jegiCount + '번';
            document.getElementById('jegiDisplay').style.animation = 'none';
            setTimeout(() => {
                document.getElementById('jegiDisplay').style.animation = 'float 0.3s ease-out';
            }, 10);
        }

        function completeGame() {
            // Save progress
            const progress = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {
                games: [false, false, false, false, false],
                facts: []
            };
            progress.games[2] = true;
            if (!progress.facts.includes('🎮')) {
                progress.facts.push('🎮');
            }
            localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));

            window.location.href = '../';
        }

        function goBack() {
            window.location.href = '../';
        }

        initGame();
    </script>
</body>
</html>
